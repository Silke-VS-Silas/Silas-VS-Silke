<style>

.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.handGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}.pointsBox{font-size:15px;font-weight:800}.resultLine{font-size:16px;margin-top:6px}

const baseCounts={
crab:9,boat:8,fish:7,shark:5,swimmer:5,shell:6,octopus:5,
penguin:3,sailor:2,lighthouse:1,shoal:1,colony:1,captain:1,mermaid:4
};

const extraCounts={
jellyfish:2,lobster:1,crabBasket:1,starfish:3,seahorse:1
};

const specs=(type,colors)=>colors.map(color=>({type,color}));

const BASE=[
...specs('crab',['darkblue','darkblue','turquoise','turquoise','black','yellow','yellow','green','gray']),
...specs('boat',['darkblue','darkblue','turquoise','turquoise','black','black','yellow','yellow']),
...specs('fish',['darkblue','darkblue','turquoise','black','black','yellow','green']),
...specs('swimmer',['darkblue','turquoise','black','yellow','peach']),
...specs('shark',['darkblue','turquoise','black','green','lavender']),
...specs('shell',['darkblue','turquoise','black','yellow','green','gray']),
...specs('octopus',['turquoise','yellow','green','gray','lavender']),
...specs('penguin',['pink','peach','lavender']),
...specs('sailor',['pink','orange']),
{type:'lighthouse',color:'lavender'},
{type:'shoal',color:'gray'},
{type:'colony',color:'green'},
{type:'captain',color:'peach'},
{type:'mermaid',color:'white'},
{type:'mermaid',color:'white'},
{type:'mermaid',color:'white'},
{type:'mermaid',color:'white'}
];

const EXTRA=[
{type:'starfish',color:'darkblue'},
{type:'starfish',color:'turquoise'},
{type:'starfish',color:'yellow'},
{type:'jellyfish',color:'pink'},
{type:'jellyfish',color:'lavender'},
{type:'lobster',color:'black'},
{type:'crabBasket',color:'green'},
{type:'seahorse',color:'white'}
];

const typeCopies={...baseCounts,...extraCounts};
let uid=1;

const safeNumber=v=>Number.isFinite(Number(v))?Number(v):0;
const safeCards=v=>Array.isArray(v)?v.filter(Boolean):[];

function shuffle(a){
a=a.slice();
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function makeDeck(){
return shuffle([...BASE,...(EXTRA_SALT?EXTRA:[])].map(s=>({id:uid++,...s})));
}

const state={
deck:[],
piles:[[],[]],
hand:[],
silasHand:[],
played:[],
silasPlayed:[],
youTotal:0,
silasTotal:0,
started:false,
busy:false,
roundOver:true,
gameOver:false,
turn:'none',
phase:'draw',
silasExtra:false,
nextStarter:'you',
currentStarter:'you',
waitingForSilasStart:false,
playerName:null,
lastMovePlayer:'',
lastMoveActions:[],
specialStatus:'',
resultTitle:'Rundenergebnis',
resultHTML:'',
youJellyBlocked:false,
silasJellyBlocked:false
};

function saveGame(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify({uid,state}));
if(state.playerName)localStorage.setItem(PLAYER_KEY,state.playerName);
}catch(e){}
}

function loadGame(){
try{
const raw=localStorage.getItem(SAVE_KEY);
if(!raw){
state.playerName=localStorage.getItem(PLAYER_KEY)||null;
return false;
}
const x=JSON.parse(raw);
if(!x?.state)return false;
Object.assign(state,x.state);
uid=safeNumber(x.uid)||uid;

for(const k of ['deck','hand','silasHand','played','silasPlayed']){
state[k]=safeCards(state[k]);
}

state.piles=Array.isArray(state.piles)
?[safeCards(state.piles[0]),safeCards(state.piles[1])]
:[[],[]];

state.youTotal=safeNumber(state.youTotal);
state.silasTotal=safeNumber(state.silasTotal);
state.playerName=state.playerName||localStorage.getItem(PLAYER_KEY)||'Silke';
state.nextStarter=state.nextStarter||'you';
state.currentStarter=state.currentStarter||'you';
state.waitingForSilasStart=!!state.waitingForSilasStart;
state.youJellyBlocked=!!state.youJellyBlocked;
state.silasJellyBlocked=!!state.silasJellyBlocked;

if(!Array.isArray(state.lastMoveActions))state.lastMoveActions=[];
state.lastMovePlayer=state.lastMovePlayer||'';
state.specialStatus=state.specialStatus||'';
state.busy=false;

return true;
}catch(e){
return false;
}
}

const playerName=()=>state.playerName||'Spieler';

function setLastMove(who,text){
if(state.lastMovePlayer!==who){
state.lastMovePlayer=who;
state.lastMoveActions=[];
}
state.lastMoveActions.push(text);
renderLastMove();
saveGame();
}

function clearLastMove(){
state.lastMovePlayer='';
state.lastMoveActions=[];
renderLastMove();
}

function renderLastMove(){
if(!state.lastMovePlayer||!state.lastMoveActions.length){
$('lastMove').textContent='Noch kein Zug.';
return;
}
$('lastMove').innerHTML=
`<div class="lastMovePlayer">${state.lastMovePlayer}:</div>
<ul class="lastMoveList">
${state.lastMoveActions.map(x=>`<li>${x}</li>`).join('')}
</ul>`;
}

function showStatus(t){
state.specialStatus=t;
$('status').textContent=t;
$('status').classList.remove('hidden');
}

function hideStatus(){
state.specialStatus='';
$('status').classList.add('hidden');
}

function countType(cards,type){
return safeCards(cards).reduce((n,c)=>n+(c.type===type),0);
}

const tables={
shell:[0,0,2,4,6,8,10],
octopus:[0,0,3,6,9,12],
penguin:[0,1,3,5],
sailor:[0,0,5]
};

function collectorScore(t,n){
const a=tables[t];
if(!a)return 0;
n=Math.max(0,Math.floor(safeNumber(n)));
return safeNumber(a[Math.min(n,a.length-1)]);
}

function bestSeahorseGain(cards){
let best=0;
const max={shell:6,octopus:5,penguin:3,sailor:2};

for(const t in max){
const n=countType(cards,t);
if(n>=1&&n<max[t]){
best=Math.max(best,collectorScore(t,n+1)-collectorScore(t,n));
}
}
return safeNumber(best);
}

function duoPointScore(cards){
const cr=countType(cards,'crab');
const lob=countType(cards,'lobster');

let p=Math.floor(cr/2)+(lob>0&&cr%2===1?1:0);

p+=Math.floor(countType(cards,'boat')/2);
p+=Math.floor(countType(cards,'fish')/2);

p+=Math.min(
countType(cards,'swimmer'),
countType(cards,'shark')+countType(cards,'jellyfish')
);

return p;
}

function scoreCards(hand,played){
const cards=[...safeCards(hand),...safeCards(played)];
let p=duoPointScore(cards);

for(const t of ['shell','octopus','penguin','sailor']){
p+=collectorScore(t,countType(cards,t));
}

if(countType(cards,'seahorse')){
p+=bestSeahorseGain(cards);
}

if(countType(cards,'lighthouse')){
p+=countType(cards,'boat');
}

if(countType(cards,'shoal')){
p+=countType(cards,'fish');
}

if(countType(cards,'colony')){
p+=2*countType(cards,'penguin');
}

if(countType(cards,'captain')){
p+=3*countType(cards,'sailor');
}

if(countType(cards,'crabBasket')){
p+=countType(cards,'crab');
}

p+=2*countType(played,'starfish');

const m=countType(cards,'mermaid');

if(m){
const f={};
cards.forEach(c=>f[c.color]=(f[c.color]||0)+1);
const vals=Object.values(f).sort((a,b)=>b-a);

for(let i=0;i<m;i++){
p+=vals[i]||0;
}
}

return safeNumber(p);
}

function colorBonus(hand,played){
const f={};

[...safeCards(hand),...safeCards(played)].forEach(c=>{
f[c.color]=(f[c.color]||0)+1;
});

const v=Object.values(f);
return v.length?Math.max(...v):0;
}

const score=()=>scoreCards(state.hand,state.played);

const hasFourMermaids=(h,p)=>
countType([...safeCards(h),...safeCards(p)],'mermaid')>=4;

function topCard(i){
const p=safeCards(state.piles[i]);
return p[p.length-1]||null;
}

function cardVisual(c){
return c.type==='seahorse'
?`<img class="seahorseArt" src="${SEAHORSE_IMG}" alt="Blaues Seepferdchen">`
:`<div class="ico">${icons[c.type]||'🃏'}</div>`;
}

function cardHTML(c,mini=false){
if(!c)return '';

const hex=colorHex[c.color]||'#ddd';

return `
<div class="card${mini?' mini':''}" style="--c:${hex}">
  <div>
    <div class="cardHead">
      <span class="colorMark"></span>
      <span class="name">${names[c.type]||c.type}</span>
    </div>

    <div class="art">${cardVisual(c)}</div>

    <div class="rule">
      ${rules[c.type]||''}
    </div>
  </div>

  <div class="cardFoot">
    <span class="meta">${colorNames[c.color]||c.color}</span>
    <span class="copies">×${typeCopies[c.type]||1}</span>
  </div>
</div>`;
}

function duoDefsFor(hand){
const d=[
{key:'crab',label:'Mr-Krabs-Duo',a:'crab',b:'crab'},
{key:'boat',label:'Boot-Duo',a:'boat',b:'boat'},
{key:'fish',label:'Fisch-Duo',a:'fish',b:'fish'},
{key:'shark',label:'Hai + Schwimmer',a:'shark',b:'swimmer'},
{key:'jellyfish',label:'Qualle + Schwimmer',a:'jellyfish',b:'swimmer'},
{key:'lobster',label:'Hummer + Mr Krabs',a:'lobster',b:'crab'}
];

return d.filter(x=>
x.a===x.b
?countType(hand,x.a)>=2
:countType(hand,x.a)&&countType(hand,x.b)
);
}

function renderSilas(){
$('silasCount').textContent=state.silasHand.length;
$('silasCards').innerHTML='';

state.silasHand.forEach(()=>{
const d=document.createElement('div');
d.className='backCard';
d.textContent='✦';
$('silasCards').appendChild(d);
});

$('silasPlayed').innerHTML=
state.silasPlayed.length
?state.silasPlayed.map(c=>cardHTML(c,true)).join('')
:'<span class="sub">Noch nichts ausgespielt.</span>';
}

function renderDuos(){
const box=$('duoActions');
box.innerHTML='';

if(
!state.started||
state.busy||
state.roundOver||
state.gameOver||
state.turn!=='you'||
state.phase!=='action'||
state.youJellyBlocked
)return;

const defs=duoDefsFor(state.hand);

defs.forEach(def=>{
const b=document.createElement('button');
b.className='btn duoBtn';
b.textContent=def.label+' ausspielen';
b.onclick=()=>playDuo(def);
box.appendChild(b);
});

if(countType(state.hand,'starfish')){
defs.forEach(def=>{
const b=document.createElement('button');
b.className='btn duoBtn';
b.textContent='Seestern + '+def.label+' = 3 Pkt';
b.onclick=()=>playStarTrio(def);
box.appendChild(b);
});
}
}

function revealSilas(){
const a=[...state.silasHand,...state.silasPlayed];

$('silasReveal').innerHTML=
a.length
?a.map(c=>cardHTML(c)).join('')
:'<span class="sub">Keine Karten.</span>';
}

function renderResult(){
if(!state.roundOver||!state.resultHTML){
$('roundResult').classList.add('hidden');
return;
}

$('roundResult').classList.remove('hidden');
$('resultTitle').textContent=state.resultTitle||'Rundenergebnis';
$('resultText').innerHTML=state.resultHTML;
revealSilas();
$('nextRoundBtn').classList.toggle('hidden',state.gameOver);
}

function render(){
$('playerScoreName').textContent=playerName();
$('youTotal').textContent=safeNumber(state.youTotal);
$('silasTotal').textContent=safeNumber(state.silasTotal);
$('deckCount').textContent=state.deck.length;
$('youPoints').textContent=safeNumber(score());

if(state.specialStatus){
$('status').textContent=state.specialStatus;
$('status').classList.remove('hidden');
}else{
$('status').classList.add('hidden');
}

renderLastMove();

const a=topCard(0);
const b=topCard(1);

$('pileAcard').innerHTML=a?cardHTML(a):'leer';
$('pileBcard').innerHTML=b?cardHTML(b):'leer';

$('handGrid').innerHTML=
state.hand.length
?state.hand.map(c=>cardHTML(c)).join('')
:'<span class="sub">Noch keine Karten.</span>';

$('playedGrid').innerHTML=
state.played.length
?state.played.map(c=>cardHTML(c,true)).join('')
:'<span class="sub">Noch nichts ausgespielt.</span>';

renderSilas();
renderDuos();
renderResult();

const yt=
state.started &&
!state.busy &&
!state.roundOver &&
!state.gameOver &&
state.turn==='you';

const draw=yt&&state.phase==='draw';
const act=yt&&state.phase==='action';
const blocked=draw&&state.youJellyBlocked;

$('drawLabel').textContent=blocked?'1 Karte ziehen':'2 Karten ziehen';

$('drawBtn').disabled=
!draw||state.deck.length<(blocked?1:2);

$('pileA').disabled=
!draw||blocked||!a;

$('pileB').disabled=
!draw||blocked||!b;

$('endTurnBtn').disabled=
!act||state.youJellyBlocked;

const enough=score()>=7;

$('stopBtn').disabled=
!act||!enough||state.youJellyBlocked;

$('chanceBtn').disabled=
!act||!enough||state.youJellyBlocked;

$('newRoundTopBtn').disabled=
!state.started||state.gameOver;
}

function closeChoice(){
state.busy=false;
$('choiceBox').classList.add('hidden');
$('choiceGrid').innerHTML='';
render();
}
