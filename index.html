<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sea Salt & Paper – Version 9i</title>

<style>
:root{
  --bg:#f6f3ec;
  --ink:#17202a;
  --muted:#6c7680;
  --line:#d7d1c6;
  --accent2:#fff4df;
  --red:#b3261e;
  --green:#2e7d32;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  padding:7px;
}

.top,
.silasHead,
.handHead{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.topActions,
.scoreBoard,
.duoActions,
.endActions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

h1{
  font-size:24px;
  margin:0;
}

.sub{
  color:var(--muted);
  font-size:13px;
}

.scoreBoard{
  font-size:17px;
  font-weight:800;
}

button{
  font:inherit;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:10px 12px;
  font-weight:700;
  min-height:42px;
}

.redBtn{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

.greenBtn{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.duoBtn,
.chanceBtn{
  background:var(--accent2);
  border-color:#e3bd7f;
}

.btn:disabled{
  opacity:.35;
}

.status{
  margin:10px 0;
  padding:10px;
  border:1px solid #c7dfdc;
  background:#edf7f6;
  border-radius:11px;
  font-weight:700;
  font-size:14px;
}

.hidden{
  display:none!important;
}

.silasBox,
.hand,
.playedBox,
.resultBox,
.lastMoveBox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
  margin-top:9px;
}

.lastMoveBox{
  background:#f7f8f9;
}

.lastMoveTitle{
  font-weight:800;
  margin-bottom:5px;
}

.lastMovePlayer{
  font-weight:800;
}

.lastMoveText{
  font-size:14px;
  line-height:1.35;
}

.backRow{
  display:flex;
  gap:4px;
  margin-top:7px;
  flex-wrap:wrap;
}

.backCard{
  width:26px;
  height:37px;
  border-radius:6px;
  background:#28506b;
  border:1px solid #fff;
  box-shadow:0 0 0 1px #28506b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:12px;
}

.board{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.zone{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:6px;
  min-height:104px;
}

.zone h2{
  font-size:13px;
  margin:0 0 6px;
  color:var(--muted);
}

.deck{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.wave{
  font-size:32px;
}

.card{
  border:1px solid rgba(0,0,0,.15);
  border-radius:10px;
  padding:6px;
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.ico{
  font-size:23px;
  line-height:1.1;
}

.name{
  font-weight:800;
  font-size:12px;
  line-height:1.1;
}

.rule{
  font-size:10px;
  line-height:1.18;
  font-weight:700;
  margin-top:5px;
  color:#26323c;
}

.meta{
  font-size:10px;
  color:#4e5963;
  margin-top:5px;
}

.darkblue{background:#cfe1f8}
.turquoise{background:#cff0ef}
.yellow{background:#faee9a}
.black{background:#dedfe2}
.green{background:#d9edcf}
.gray{background:#ececee}
.lavender{background:#e6d8f2}
.pink{background:#f4cedf}
.peach{background:#f4d3ba}
.orange{background:#f1b978}
.tan{background:#e8d8c1}
.white{background:#fff}

.choice{
  margin-top:9px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
}

.choiceGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:7px;
}

.handGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-top:7px;
}

.playedGrid{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}

.mini{
  width:82px;
  min-height:90px;
}

.pointsBox{
  font-size:15px;
  font-weight:700;
}

.resultLine{
  font-size:16px;
  margin-top:6px;
}

/* Namensauswahl */

.nameOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:18px;
}

.nameDialog{
  width:min(420px,100%);
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.nameDialog h2{
  margin:0 0 7px;
}

.nameButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}

.nameBtn{
  padding:14px 8px;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <div>
      <h1>Sea Salt & Paper</h1>

      <div class="sub">
        Version 9i
      </div>
    </div>


    <div class="scoreBoard">

      <span>
        <span id="playerScoreName">Spieler</span>:
        <span id="youTotal">0</span>
      </span>

      <span>
        Silas:
        <span id="silasTotal">0</span>
      </span>

    </div>


    <div class="topActions">

      <button
        id="newBtn"
        class="btn redBtn"
        type="button">
        Neues Spiel
      </button>

      <button
        id="newRoundTopBtn"
        class="btn greenBtn"
        type="button">
        Neue Runde
      </button>

      <button
        id="changePlayerBtn"
        class="btn"
        type="button">
        Spieler wechseln
      </button>

    </div>

  </div>


  <div
    id="status"
    class="status hidden">
  </div>


  <div class="silasBox">

    <div class="silasHead">

      <div>

        <strong>Silas</strong>

        <div class="sub">
          Verdeckte Hand:
          <span id="silasCount">0</span>
          Karten
        </div>

      </div>

    </div>


    <div
      id="silasCards"
      class="backRow">
    </div>


    <div style="margin-top:10px">

      <strong>
        Silas ausgespielt
      </strong>

    </div>


    <div
      id="silasPlayed"
      class="playedGrid">
    </div>

  </div>


  <div class="lastMoveBox">

    <div class="lastMoveTitle">
      Letzter Zug
    </div>

    <div id="lastMove" class="lastMoveText">
      Noch kein Zug.
    </div>

  </div>


  <div class="board">

    <button
      id="drawBtn"
      class="zone deck"
      type="button"
      disabled>

      <div class="wave">
        🌊
      </div>

      <strong>
        2 Karten ziehen
      </strong>

      <div class="sub">
        <span id="deckCount">0</span>
        übrig
      </div>

    </button>


    <button
      id="pileA"
      class="zone"
      type="button"
      disabled>

      <h2>
        Ablage A
      </h2>

      <div id="pileAcard">
        leer
      </div>

    </button>


    <button
      id="pileB"
      class="zone"
      type="button"
      disabled>

      <h2>
        Ablage B
      </h2>

      <div id="pileBcard">
        leer
      </div>

    </button>

  </div>


  <div
    id="choiceBox"
    class="choice hidden">

    <strong id="choiceTitle"></strong>

    <div
      id="choiceGrid"
      class="choiceGrid">
    </div>

  </div>


  <div class="hand">

    <div class="handHead">

      <div>

        <strong>
          Deine Hand
        </strong>

        <div class="pointsBox">
          Punkte:
          <span id="youPoints">0</span>
        </div>

      </div>


      <div class="endActions">

        <button
          id="endTurnBtn"
          class="btn greenBtn"
          type="button"
          disabled>
          Zug beenden
        </button>

        <button
          id="stopBtn"
          class="btn"
          type="button"
          disabled>
          Stopp
        </button>

        <button
          id="chanceBtn"
          class="btn chanceBtn"
          type="button"
          disabled>
          Letzte Chance
        </button>

      </div>

    </div>


    <div
      id="handGrid"
      class="handGrid">
    </div>


    <div
      id="duoActions"
      class="duoActions">
    </div>

  </div>


  <div class="playedBox">

    <strong>
      Deine ausgespielten Duos
    </strong>

    <div
      id="playedGrid"
      class="playedGrid">
    </div>

  </div>


  <div
    id="roundResult"
    class="resultBox hidden">

    <strong id="resultTitle">
      Rundenergebnis
    </strong>

    <div
      id="resultText"
      style="margin-top:8px">
    </div>


    <div style="margin-top:12px">

      <strong>
        Silas deckt auf
      </strong>

    </div>


    <div
      id="silasReveal"
      class="handGrid">
    </div>


    <button
      id="nextRoundBtn"
      class="btn greenBtn"
      type="button"
      style="margin-top:12px">
      Nächste Runde
    </button>

  </div>

</div>


<div
  id="nameOverlay"
  class="nameOverlay hidden">

  <div class="nameDialog">

    <h2>
      Wer spielt gegen Silas?
    </h2>

    <div class="sub">
      Wähle deinen Spielernamen.
    </div>

    <div class="nameButtons">

      <button
        class="btn nameBtn"
        data-name="Silke"
        type="button">
        Silke
      </button>

      <button
        class="btn nameBtn"
        data-name="Karin"
        type="button">
        Karin
      </button>

      <button
        class="btn nameBtn"
        data-name="Stinker"
        type="button">
        Stinker
      </button>

      <button
        class="btn nameBtn"
        data-name="Dicke Hummel"
        type="button">
        Dicke Hummel
      </button>

    </div>

  </div>

</div>


<script>
(()=>{

'use strict';


const $=
  id=>document.getElementById(id);


/*
  Gleicher Speicher wie 9f/9g/9h.
  Dadurch bleibt eine bestehende Partie erhalten.
*/
const SAVE_KEY=
  'silke-vs-silas-v9f';


const PLAYER_KEY=
  'sea-salt-player-name';


const names={

  crab:'Mr Krabs',

  boat:'Boot',

  fish:'Fisch',

  shark:'Hai',

  swimmer:'Schwimmer',

  shell:'Muschel',

  octopus:'Oktopus',

  penguin:'Pinguin',

  sailor:'Anker',

  mermaid:'Meerjungfrau',

  lighthouse:'eine pro Boot',

  shoal:'ein pro Fisch',

  colony:'zwei pro Pinguin',

  captain:'drei pro Anker'
};


const icons={

  crab:'🦀',

  boat:'⛵',

  fish:'🐟',

  shark:'🦈',

  swimmer:'🏊',

  shell:'🐚',

  octopus:'🐙',

  penguin:'🐧',

  sailor:'⚓',

  mermaid:'🧜‍♀️',

  lighthouse:'🗼',

  shoal:'🐟',

  colony:'🐧',

  captain:'🧭'
};


const cardRules={

  crab:
    '2 = 1 Pkt · Ablage durchsuchen',

  boat:
    '2 = 1 Pkt · Extra-Zug',

  fish:
    '2 = 1 Pkt · 1 Karte ziehen',

  shark:
    'Hai + Schwimmer = 1 Pkt · Karte stehlen',

  swimmer:
    'Hai + Schwimmer = 1 Pkt · Karte stehlen',

  shell:
    '2=2 · 3=4 · 4=6 · 5=8 · 6=10',

  octopus:
    '2=3 · 3=6 · 4=9 · 5=12',

  penguin:
    '1=1 · 2=3 · 3=5',

  sailor:
    '2 = 5 Punkte',

  lighthouse:
    '+1 je Boot',

  shoal:
    '+1 je Fisch',

  colony:
    '+2 je Pinguin',

  captain:
    '+3 je Anker',

  mermaid:
    'Wertet häufigste Farbe · 4 = Sofortsieg'
};


const colorNames={

  darkblue:'Dunkelblau',

  turquoise:'Türkis',

  yellow:'Gelb',

  black:'Schwarz',

  green:'Grün',

  gray:'Grau',

  lavender:'Lila',

  pink:'Rosa',

  peach:'Pfirsich',

  orange:'Orange',

  tan:'Beige',

  white:'Weiß'
};


const typeCounts={

  crab:9,

  boat:8,

  fish:7,

  shark:5,

  swimmer:5,

  shell:6,

  octopus:5,

  penguin:3,

  sailor:2,

  lighthouse:1,

  shoal:1,

  colony:1,

  captain:1,

  mermaid:4
};


const colorCounts={

  darkblue:9,

  turquoise:9,

  yellow:8,

  black:8,

  green:6,

  gray:4,

  lavender:4,

  pink:2,

  peach:2,

  orange:1,

  tan:1,

  white:4
};


let uid=1;


function shuffle(arr){

  const a=
    arr.slice();


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];
  }


  return a;
}


function makeDeck(){

  const types=[];
  const colors=[];


  Object.entries(
    typeCounts
  )
  .forEach(
    ([t,n])=>{

      if(
        t!=='mermaid'
      ){

        for(
          let i=0;
          i<n;
          i++
        ){

          types.push(t);
        }
      }
    }
  );


  Object.entries(
    colorCounts
  )
  .forEach(
    ([c,n])=>{

      if(
        c!=='white'
      ){

        for(
          let i=0;
          i<n;
          i++
        ){

          colors.push(c);
        }
      }
    }
  );


  const cs=
    shuffle(colors);


  const cards=
    types.map(
      (type,i)=>({

        id:uid++,

        type:type,

        color:cs[i]

      })
    );


  for(
    let i=0;
    i<4;
    i++
  ){

    cards.push({

      id:uid++,

      type:'mermaid',

      color:'white'

    });
  }


  return shuffle(cards);
}


const state={

  deck:[],

  piles:[
    [],
    []
  ],

  hand:[],

  silasHand:[],

  played:[],

  silasPlayed:[],

  youTotal:0,

  silasTotal:0,

  started:false,

  busy:false,

  roundOver:true,

  gameOver:false,

  turn:'none',

  phase:'draw',

  silasExtra:false,

  nextStarter:'you',

  currentStarter:'you',

  playerName:null,

  lastMovePlayer:'',

  lastMoveText:'Noch kein Zug.',

  specialStatus:'',

  resultTitle:'Rundenergebnis',

  resultHTML:''
};


/* =========================
   SPEICHERN
========================= */

function saveGame(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify({

        uid:uid,

        state:state

      })
    );


    if(
      state.playerName
    ){

      localStorage.setItem(
        PLAYER_KEY,
        state.playerName
      );
    }

  }
  catch(e){}
}


function loadGame(){

  try{

    const raw=
      localStorage.getItem(
        SAVE_KEY
      );


    if(!raw){

      const savedName=
        localStorage.getItem(
          PLAYER_KEY
        );


      if(savedName){

        state.playerName=
          savedName;
      }


      return false;
    }


    const saved=
      JSON.parse(raw);


    if(
      !saved ||
      !saved.state
    ){

      return false;
    }


    Object.assign(
      state,
      saved.state
    );


    uid=
      saved.uid||
      uid;


    /*
      Alte Versionen hatten noch keinen Spielernamen.
      Auf Silkes bestehendem Gerät wird dann Silke übernommen.
    */
    if(
      !state.playerName
    ){

      state.playerName=
        localStorage.getItem(
          PLAYER_KEY
        )
        ||
        'Silke';
    }


    if(
      !state.nextStarter
    ){

      state.nextStarter=
        'you';
    }


    if(
      !state.currentStarter
    ){

      state.currentStarter=
        'you';
    }


    if(
      !state.lastMoveText
    ){

      state.lastMoveText=
        'Noch kein Zug.';
    }


    if(
      !state.lastMovePlayer
    ){

      state.lastMovePlayer='';
    }


    if(
      typeof state.specialStatus!=='string'
    ){

      state.specialStatus='';
    }


    /*
      Falls genau während Silas' Animation
      geschlossen wurde, setzen wir den Zustand
      zunächst sauber zurück.
    */
    state.busy=false;


    return true;

  }
  catch(e){

    return false;
  }
}


/* =========================
   TEXTE
========================= */

function playerName(){

  return state.playerName||
    'Spieler';
}


function setLastMove(
  who,
  text
){

  state.lastMovePlayer=
    who;

  state.lastMoveText=
    text;


  renderLastMove();

  saveGame();
}


function renderLastMove(){

  if(
    !state.lastMovePlayer
  ){

    $('lastMove')
      .textContent=
      state.lastMoveText||
      'Noch kein Zug.';

    return;
  }


  $('lastMove')
    .innerHTML=

    `<span class="lastMovePlayer">${state.lastMovePlayer}:</span> `

    +

    state.lastMoveText;
}


function showSpecialStatus(text){

  state.specialStatus=
    text;


  $('status')
    .textContent=
    text;


  $('status')
    .classList
    .remove(
      'hidden'
    );
}


function hideSpecialStatus(){

  state.specialStatus='';


  $('status')
    .classList
    .add(
      'hidden'
    );
}


/* =========================
   PUNKTE
========================= */

function countType(
  cards,
  type
){

  return cards.filter(
    c=>c.type===type
  ).length;
}


function scoreCards(
  hand,
  played
){

  const cards=
    hand.concat(
      played
    );


  let p=0;


  p+=
    Math.floor(
      countType(
        cards,
        'crab'
      )/2
    );


  p+=
    Math.floor(
      countType(
        cards,
        'boat'
      )/2
    );


  p+=
    Math.floor(
      countType(
        cards,
        'fish'
      )/2
    );


  p+=
    Math.min(

      countType(
        cards,
        'shark'
      ),

      countType(
        cards,
        'swimmer'
      )

    );


  const sh=[
    0,0,2,4,6,8,10
  ];


  const oc=[
    0,0,3,6,9,12
  ];


  const pe=[
    0,1,3,5
  ];


  const sa=[
    0,0,5
  ];


  p+=
    sh[
      Math.min(
        countType(
          cards,
          'shell'
        ),
        6
      )
    ]||0;


  p+=
    oc[
      Math.min(
        countType(
          cards,
          'octopus'
        ),
        5
      )
    ]||0;


  p+=
    pe[
      Math.min(
        countType(
          cards,
          'penguin'
        ),
        3
      )
    ]||0;


  p+=
    sa[
      Math.min(
        countType(
          cards,
          'sailor'
        ),
        2
      )
    ]||0;


  if(
    countType(
      cards,
      'lighthouse'
    )
  ){

    p+=
      countType(
        cards,
        'boat'
      );
  }


  if(
    countType(
      cards,
      'shoal'
    )
  ){

    p+=
      countType(
        cards,
        'fish'
      );
  }


  if(
    countType(
      cards,
      'colony'
    )
  ){

    p+=
      2*
      countType(
        cards,
        'penguin'
      );
  }


  if(
    countType(
      cards,
      'captain'
    )
  ){

    p+=
      3*
      countType(
        cards,
        'sailor'
      );
  }


  const m=
    countType(
      cards,
      'mermaid'
    );


  if(m){

    const f={};


    cards.forEach(
      c=>{

        f[c.color]=
          (
            f[c.color]||
            0
          )
          +1;
      }
    );


    const vals=
      Object.values(f)
        .sort(
          (a,b)=>b-a
        );


    for(
      let i=0;
      i<m;
      i++
    ){

      p+=
        vals[i]||
        0;
    }
  }


  return p;
}


function colorBonus(
  hand,
  played
){

  const f={};


  hand.concat(
    played
  )
  .forEach(
    c=>{

      f[c.color]=
        (
          f[c.color]||
          0
        )
        +1;
    }
  );


  const vals=
    Object.values(f);


  return vals.length
    ? Math.max(...vals)
    : 0;
}


function score(){

  return scoreCards(
    state.hand,
    state.played
  );
}


function hasFourMermaids(
  hand,
  played
){

  return countType(
    hand.concat(
      played
    ),
    'mermaid'
  )>=4;
}


/* =========================
   KARTEN
========================= */

function topCard(index){

  const pile=
    state.piles[index];


  return pile[
    pile.length-1
  ]||null;
}


function cardHTML(
  card,
  mini=false
){

  const rule=
    cardRules[
      card.type
    ]||'';


  return `
    <div class="card ${card.color}${mini?' mini':''}">

      <div>

        <div class="ico">
          ${icons[card.type]}
        </div>

        <div class="name">
          ${names[card.type]}
        </div>

        <div class="rule">
          ${rule}
        </div>

      </div>

      <div class="meta">
        ${colorNames[card.color]}
      </div>

    </div>
  `;
}


/* =========================
   DARSTELLUNG
========================= */

function renderSilas(){

  $('silasCount')
    .textContent=
    state.silasHand.length;


  $('silasCards')
    .innerHTML='';


  state.silasHand
    .forEach(
      ()=>{

        const card=
          document.createElement(
            'div'
          );


        card.className=
          'backCard';


        card.textContent=
          '✦';


        $('silasCards')
          .appendChild(
            card
          );
      }
    );


  $('silasPlayed')
    .innerHTML=

    state.silasPlayed.length

    ? state.silasPlayed
        .map(
          c=>
            cardHTML(
              c,
              true
            )
        )
        .join('')

    : '<span class="sub">Noch nichts ausgespielt.</span>';
}


function renderDuos(){

  const box=
    $('duoActions');


  box.innerHTML='';


  if(
    !state.started ||
    state.busy ||
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action'
  ){

    return;
  }


  const defs=[

    [
      'Mr-Krabs-Duo ausspielen',

      countType(
        state.hand,
        'crab'
      )>=2,

      ()=>playDuo(
        'crab',
        'crab'
      )
    ],

    [
      'Boot-Duo ausspielen',

      countType(
        state.hand,
        'boat'
      )>=2,

      ()=>playDuo(
        'boat',
        'boat'
      )
    ],

    [
      'Fisch-Duo ausspielen',

      countType(
        state.hand,
        'fish'
      )>=2,

      ()=>playDuo(
        'fish',
        'fish'
      )
    ],

    [
      'Hai + Schwimmer ausspielen',

      countType(
        state.hand,
        'shark'
      )>=1
      &&
      countType(
        state.hand,
        'swimmer'
      )>=1,

      ()=>playDuo(
        'shark',
        'swimmer'
      )
    ]

  ];


  defs.forEach(
    ([label,ok,fn])=>{

      if(!ok){

        return;
      }


      const b=
        document.createElement(
          'button'
        );


      b.type=
        'button';


      b.className=
        'btn duoBtn';


      b.textContent=
        label;


      b.addEventListener(
        'click',
        fn
      );


      box.appendChild(
        b
      );
    }
  );
}


function revealSilas(){

  const all=
    state.silasHand
      .concat(
        state.silasPlayed
      );


  $('silasReveal')
    .innerHTML=

    all.length

    ? all
        .map(
          c=>cardHTML(c)
        )
        .join('')

    : '<span class="sub">Keine Karten.</span>';
}


function renderResult(){

  if(
    !state.roundOver ||
    !state.resultHTML
  ){

    $('roundResult')
      .classList
      .add(
        'hidden'
      );


    return;
  }


  $('roundResult')
    .classList
    .remove(
      'hidden'
    );


  $('resultTitle')
    .textContent=
    state.resultTitle||
    'Rundenergebnis';


  $('resultText')
    .innerHTML=
    state.resultHTML;


  revealSilas();


  $('nextRoundBtn')
    .classList
    .toggle(
      'hidden',
      state.gameOver
    );
}


function render(){

  $('playerScoreName')
    .textContent=
    playerName();


  $('youTotal')
    .textContent=
    state.youTotal;


  $('silasTotal')
    .textContent=
    state.silasTotal;


  $('deckCount')
    .textContent=
    state.deck.length;


  $('youPoints')
    .textContent=
    score();


  if(
    state.specialStatus
  ){

    $('status')
      .textContent=
      state.specialStatus;


    $('status')
      .classList
      .remove(
        'hidden'
      );
  }
  else{

    $('status')
      .classList
      .add(
        'hidden'
      );
  }


  renderLastMove();


  const a=
    topCard(0);


  const b=
    topCard(1);


  $('pileAcard')
    .innerHTML=
    a
    ? cardHTML(a)
    : 'leer';


  $('pileBcard')
    .innerHTML=
    b
    ? cardHTML(b)
    : 'leer';


  $('handGrid')
    .innerHTML=

    state.hand.length

    ? state.hand
        .map(
          c=>cardHTML(c)
        )
        .join('')

    : '<span class="sub">Noch keine Karten.</span>';


  $('playedGrid')
    .innerHTML=

    state.played.length

    ? state.played
        .map(
          c=>
            cardHTML(
              c,
              true
            )
        )
        .join('')

    : '<span class="sub">Noch nichts ausgespielt.</span>';


  renderSilas();

  renderDuos();

  renderResult();


  const yourTurn=

    state.started

    &&

    !state.busy

    &&

    !state.roundOver

    &&

    !state.gameOver

    &&

    state.turn==='you';


  const canDraw=

    yourTurn

    &&

    state.phase==='draw';


  const canAct=

    yourTurn

    &&

    state.phase==='action';


  $('drawBtn')
    .disabled=

    !canDraw

    ||

    state.deck.length<2;


  $('pileA')
    .disabled=

    !canDraw

    ||

    !a;


  $('pileB')
    .disabled=

    !canDraw

    ||

    !b;


  $('endTurnBtn')
    .disabled=
    !canAct;


  const enough=
    score()>=7;


  $('stopBtn')
    .disabled=

    !canAct

    ||

    !enough;


  $('chanceBtn')
    .disabled=

    !canAct

    ||

    !enough;


  $('newRoundTopBtn')
    .disabled=

    !state.started

    ||

    state.gameOver;
}

function closeChoice(){

  state.busy=false;


  $('choiceBox')
    .classList
    .add(
      'hidden'
    );


  $('choiceGrid')
    .innerHTML='';


  render();
}


function showChoice(
  title,
  options
){

  state.busy=true;


  $('choiceTitle')
    .textContent=
    title;


  $('choiceGrid')
    .innerHTML='';


  $('choiceBox')
    .classList
    .remove(
      'hidden'
    );


  options.forEach(
    option=>{

      const b=
        document.createElement(
          'button'
        );


      b.type=
        'button';


      b.className=
        'btn';


      b.innerHTML=
        option.html||
        option.label;


      b.addEventListener(
        'click',
        option.onClick
      );


      $('choiceGrid')
        .appendChild(
          b
        );
    }
  );


  render();
}


/* =========================
   RUNDE / SPIEL
========================= */

function startRound(){

  if(
    state.gameOver
  ){

    showSpecialStatus(
      'Die Partie ist beendet. Für eine neue Partie bitte „Neues Spiel“ drücken.'
    );


    render();

    return;
  }


  const starter=
    state.nextStarter||
    'you';


  state.currentStarter=
    starter;


  state.nextStarter=
    starter==='you'
    ? 'silas'
    : 'you';


  state.deck=
    makeDeck();


  state.piles=[
    [],
    []
  ];


  state.hand=[];

  state.silasHand=[];

  state.played=[];

  state.silasPlayed=[];


  state.started=true;

  state.roundOver=false;

  state.phase='draw';

  state.silasExtra=false;

  state.resultTitle=
    'Rundenergebnis';

  state.resultHTML='';


  state.lastMovePlayer='';

  state.lastMoveText=
    'Noch kein Zug.';


  state.piles[0]
    .push(
      state.deck.pop()
    );


  state.piles[1]
    .push(
      state.deck.pop()
    );


  if(
    starter==='you'
  ){

    state.turn=
      'you';


    state.busy=
      false;


    showSpecialStatus(
      playerName()
      +
      ' beginnt diese Runde.'
    );


    render();

    saveGame();
  }
  else{

    state.turn=
      'silas';


    state.busy=
      true;


    showSpecialStatus(
      'Silas beginnt diese Runde.'
    );


    render();

    saveGame();


    setTimeout(
      silasTurn,
      700
    );
  }
}


function newGame(){

  state.youTotal=0;

  state.silasTotal=0;

  state.gameOver=false;

  state.started=false;

  state.roundOver=true;

  state.nextStarter=
    'you';

  state.currentStarter=
    'you';

  state.lastMovePlayer='';

  state.lastMoveText=
    'Noch kein Zug.';

  state.specialStatus='';


  startRound();

  saveGame();
}

function enterActionPhase(){

  state.phase=
    'action';


  hideSpecialStatus();

  render();

  saveGame();
}


function drawTwo(){

  if(
    state.deck.length<2 ||
    state.busy ||
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='draw'
  ){

    return;
  }


  const first=
    state.deck.pop();


  const second=
    state.deck.pop();


  showChoice(
    'Welche Karte möchtest du behalten?',
    [

      {
        html:
          cardHTML(first),

        onClick:
          ()=>chooseDiscard(
            first,
            second
          )
      },

      {
        html:
          cardHTML(second),

        onClick:
          ()=>chooseDiscard(
            second,
            first
          )
      }

    ]
  );
}


function chooseDiscard(
  keep,
  discard
){

  const emptyA=
    state.piles[0].length===0;


  const emptyB=
    state.piles[1].length===0;


  if(
    emptyA||
    emptyB
  ){

    const idx=
      emptyA
      ? 0
      : 1;


    state.hand
      .push(
        keep
      );


    state.piles[idx]
      .push(
        discard
      );


    closeChoice();


    setLastMove(
      playerName(),

      'behält '
      +
      names[keep.type]
      +
      '. '
      +
      names[discard.type]
      +
      ' wird automatisch auf Ablage '
      +
      (
        idx===0
        ? 'A'
        : 'B'
      )
      +
      ' gelegt.'
    );


    afterYouGain();

    return;
  }


  showChoice(
    names[discard.type]
    +
    ' ablegen auf …',
    [

      {
        label:
          'Ablage A',

        onClick:
          ()=>{

            state.hand
              .push(
                keep
              );


            state.piles[0]
              .push(
                discard
              );


            closeChoice();


            setLastMove(
              playerName(),

              'behält '
              +
              names[keep.type]
              +
              ' und legt '
              +
              names[discard.type]
              +
              ' auf Ablage A.'
            );


            afterYouGain();
          }
      },

      {
        label:
          'Ablage B',

        onClick:
          ()=>{

            state.hand
              .push(
                keep
              );


            state.piles[1]
              .push(
                discard
              );


            closeChoice();


            setLastMove(
              playerName(),

              'behält '
              +
              names[keep.type]
              +
              ' und legt '
              +
              names[discard.type]
              +
              ' auf Ablage B.'
            );


            afterYouGain();
          }
      }

    ]
  );
}


function takePile(index){

  if(
    state.busy ||
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='draw'
  ){

    return;
  }


  const card=
    state.piles[index]
      .pop();


  if(!card){

    return;
  }


  state.hand
    .push(
      card
    );


  setLastMove(
    playerName(),

    'nimmt '
    +
    names[card.type]
    +
    ' von Ablage '
    +
    (
      index===0
      ? 'A'
      : 'B'
    )
    +
    '.'
  );


  afterYouGain();
}


function afterYouGain(){

  if(
    hasFourMermaids(
      state.hand,
      state.played
    )
  ){

    instantWin(
      'you'
    );


    return;
  }


  enterActionPhase();
}


/* =========================
   DUOS
========================= */

function removePairFrom(
  hand,
  a,
  b
){

  const first=
    hand.findIndex(
      c=>c.type===a
    );


  if(first<0){

    return null;
  }


  const card1=
    hand.splice(
      first,
      1
    )[0];


  const second=
    hand.findIndex(
      c=>c.type===b
    );


  if(second<0){

    hand.push(
      card1
    );


    return null;
  }


  return [

    card1,

    hand.splice(
      second,
      1
    )[0]

  ];
}


function playDuo(
  a,
  b
){

  if(
    state.busy ||
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action'
  ){

    return;
  }


  const pair=
    removePairFrom(
      state.hand,
      a,
      b
    );


  if(!pair){

    return;
  }


  state.played
    .push(
      ...pair
    );


  /* Boot */

  if(
    a==='boat'
  ){

    state.phase=
      'draw';


    setLastMove(
      playerName(),

      'spielt ein Boot-Duo und bekommt einen Extra-Zug.'
    );


    hideSpecialStatus();

    render();

    saveGame();

    return;
  }


  /* Fisch */

  if(
    a==='fish'
  ){

    if(
      state.deck.length
    ){

      const card=
        state.deck.pop();


      state.hand
        .push(
          card
        );


      setLastMove(
        playerName(),

        'spielt ein Fisch-Duo und zieht '
        +
        names[card.type]
        +
        ' vom Nachziehstapel.'
      );


      if(
        hasFourMermaids(
          state.hand,
          state.played
        )
      ){

        instantWin(
          'you'
        );


        return;
      }
    }
    else{

      setLastMove(
        playerName(),

        'spielt ein Fisch-Duo. Der Nachziehstapel ist leer.'
      );
    }


    render();

    saveGame();

    return;
  }


  /* Hai + Schwimmer */

  if(
    a==='shark'
    &&
    b==='swimmer'
  ){

    if(
      state.silasHand.length
    ){

      const i=
        Math.floor(
          Math.random()*
          state.silasHand.length
        );


      const stolen=
        state.silasHand
          .splice(
            i,
            1
          )[0];


      state.hand
        .push(
          stolen
        );


      /*
        Wichtig:
        Hier wird ausdrücklich angezeigt,
        WAS gestohlen wurde.
      */
      setLastMove(
        playerName(),

        'spielt Hai + Schwimmer und stiehlt Silas '
        +
        names[stolen.type]
        +
        '.'
      );


      if(
        hasFourMermaids(
          state.hand,
          state.played
        )
      ){

        instantWin(
          'you'
        );


        return;
      }
    }
    else{

      setLastMove(
        playerName(),

        'spielt Hai + Schwimmer. Silas hat keine Karte zum Stehlen.'
      );
    }


    render();

    saveGame();

    return;
  }


  /* Mr Krabs */

  if(
    a==='crab'
  ){

    chooseCrabPile();
  }
}


function chooseCrabPile(){

  showChoice(
    'Mr Krabs: Welchen Ablagestapel möchtest du durchsuchen?',
    [

      {
        label:
          'Stapel A wählen',

        onClick:
          ()=>showCrabCards(
            0
          )
      },

      {
        label:
          'Stapel B wählen',

        onClick:
          ()=>showCrabCards(
            1
          )
      }

    ]
  );
}


function showCrabCards(index){

  $('choiceTitle')
    .textContent=

    'Mr Krabs – wähle eine Karte aus Stapel '

    +

    (
      index===0
      ? 'A'
      : 'B'
    );


  $('choiceGrid')
    .innerHTML='';


  if(
    !state.piles[index]
      .length
  ){

    const b=
      document.createElement(
        'button'
      );


    b.type=
      'button';


    b.className=
      'btn';


    b.textContent=
      'Stapel ist leer';


    b.addEventListener(
      'click',
      ()=>{

        closeChoice();


        setLastMove(
          playerName(),

          'spielt ein Mr-Krabs-Duo, aber Ablage '
          +
          (
            index===0
            ? 'A'
            : 'B'
          )
          +
          ' ist leer.'
        );


        render();

        saveGame();
      }
    );


    $('choiceGrid')
      .appendChild(
        b
      );


    return;
  }


  state.piles[index]
    .slice()
    .reverse()
    .forEach(
      card=>{

        const b=
          document.createElement(
            'button'
          );


        b.type=
          'button';


        b.className=
          'btn';


        b.innerHTML=
          cardHTML(
            card
          );


        b.addEventListener(
          'click',
          ()=>{

            const ri=
              state.piles[index]
                .findIndex(
                  c=>c.id===card.id
                );


            const chosen=
              state.piles[index]
                .splice(
                  ri,
                  1
                )[0];


            state.hand
              .push(
                chosen
              );


            closeChoice();


            setLastMove(
              playerName(),

              'spielt ein Mr-Krabs-Duo und holt '
              +
              names[chosen.type]
              +
              ' aus Ablage '
              +
              (
                index===0
                ? 'A'
                : 'B'
              )
              +
              '.'
            );


            if(
              hasFourMermaids(
                state.hand,
                state.played
              )
            ){

              instantWin(
                'you'
              );


              return;
            }


            render();

            saveGame();
          }
        );


        $('choiceGrid')
          .appendChild(
            b
          );
      }
    );
}

/* =========================
   SILAS KI
========================= */

function silasCardValue(card){

  const hand=
    state.silasHand;


  const all=
    state.silasHand
      .concat(
        state.silasPlayed
      );


  const n=
    type=>
      countType(
        hand,
        type
      );


  const total=
    type=>
      countType(
        all,
        type
      );


  /* Meerjungfrau */

  if(
    card.type==='mermaid'
  ){

    return 8;
  }


  /* Muschel */

  if(
    card.type==='shell'
  ){

    const shells=
      n('shell');


    /*
      Erste Muschel:
      möglichst meiden.
    */
    if(
      shells===0
    ){

      return .2;
    }


    return 4.5;
  }


  /* Oktopus */

  if(
    card.type==='octopus'
  ){

    const octos=
      n('octopus');


    if(
      octos===0
    ){

      return 1.5;
    }


    return 5.2;
  }


  /* Pinguin */

  if(
    card.type==='penguin'
  ){

    const penguins=
      n('penguin');


    const multiplier=
      total('colony')>0;


    if(
      penguins===0
    ){

      return multiplier
        ? 5
        : 3.2;
    }


    if(
      penguins===1
    ){

      return multiplier
        ? 6.5
        : 4.6;
    }


    return multiplier
      ? 7
      : 4.8;
  }


  /* Anker */

  if(
    card.type==='sailor'
  ){

    const anchors=
      n('sailor');


    const hasMultiplier=
      total('captain')>0;


    if(
      anchors===0
    ){

      return hasMultiplier
        ? 4.8
        : .5;
    }


    return hasMultiplier
      ? 8
      : 6.5;
  }


  /* drei pro Anker */

  if(
    card.type==='captain'
  ){

    const anchors=
      total('sailor');


    if(
      anchors===0
    ){

      return 1;
    }


    if(
      anchors===1
    ){

      return 4.8;
    }


    return 8;
  }


  /* eine pro Boot */

  if(
    card.type==='lighthouse'
  ){

    const boats=
      total('boat');


    if(
      boats===0
    ){

      return .8;
    }


    if(
      boats===1
    ){

      return 2.5;
    }


    if(
      boats===2
    ){

      return 3.8;
    }


    return 5+
      boats*.3;
  }


  /* ein pro Fisch */

  if(
    card.type==='shoal'
  ){

    const fish=
      total('fish');


    if(
      fish===0
    ){

      return .8;
    }


    if(
      fish===1
    ){

      return 2.5;
    }


    if(
      fish===2
    ){

      return 3.8;
    }


    return 5+
      fish*.3;
  }


  /* zwei pro Pinguin */

  if(
    card.type==='colony'
  ){

    const penguins=
      total('penguin');


    if(
      penguins===0
    ){

      return 1;
    }


    if(
      penguins===1
    ){

      return 4;
    }


    if(
      penguins===2
    ){

      return 6;
    }


    return 8;
  }


  /* Mr Krabs */

  if(
    card.type==='crab'
  ){

    return n('crab')>0
      ? 5.5
      : 1.4;
  }


  /* Boot */

  if(
    card.type==='boat'
  ){

    let value=
      n('boat')>0
      ? 6
      : 1.8;


    if(
      total('lighthouse')>0
    ){

      value+=1.5;
    }


    return value;
  }


  /* Fisch */

  if(
    card.type==='fish'
  ){

    let value=
      n('fish')>0
      ? 5.7
      : 1.8;


    if(
      total('shoal')>0
    ){

      value+=1.5;
    }


    return value;
  }


  /* Hai */

  if(
    card.type==='shark'
  ){

    return n('swimmer')>0
      ? 6
      : 1.2;
  }


  /* Schwimmer */

  if(
    card.type==='swimmer'
  ){

    return n('shark')>0
      ? 6
      : 1.2;
  }


  return 1;
}


function silasTakeOneCard(){

  const a=
    topCard(0);


  const b=
    topCard(1);


  const va=
    a
    ? silasCardValue(a)
    : -1;


  const vb=
    b
    ? silasCardValue(b)
    : -1;


  /*
    Offene Karte nur,
    wenn sie attraktiv genug ist.
  */
  if(
    Math.max(
      va,
      vb
    )>=4
  ){

    const i=
      va>=vb
      ? 0
      : 1;


    const chosen=
      state.piles[i]
        .pop();


    state.silasHand
      .push(
        chosen
      );


    setLastMove(
      'Silas',

      'nimmt '
      +
      names[chosen.type]
      +
      ' von Ablage '
      +
      (
        i===0
        ? 'A'
        : 'B'
      )
      +
      '.'
    );


    return;
  }


  if(
    state.deck.length>=2
  ){

    const x=
      state.deck.pop();


    const y=
      state.deck.pop();


    const keep=
      silasCardValue(x)
      >=
      silasCardValue(y)
      ? x
      : y;


    const discard=
      keep===x
      ? y
      : x;


    state.silasHand
      .push(
        keep
      );


    const emptyA=
      state.piles[0].length===0;


    const emptyB=
      state.piles[1].length===0;


    const pileIndex=

      (
        emptyA||
        emptyB
      )

      ? (
          emptyA
          ? 0
          : 1
        )

      : (
          Math.random()<.5
          ? 0
          : 1
        );


    state.piles[
      pileIndex
    ]
    .push(
      discard
    );


    setLastMove(
      'Silas',

      'zieht 2 Karten und legt '
      +
      names[discard.type]
      +
      ' auf Ablage '
      +
      (
        pileIndex===0
        ? 'A'
        : 'B'
      )
      +
      '.'
    );


    return;
  }


  let index=-1;


  if(
    a&&b
  ){

    index=
      va>=vb
      ? 0
      : 1;
  }
  else if(a){

    index=0;
  }
  else if(b){

    index=1;
  }


  if(
    index>=0
  ){

    const chosen=
      state.piles[index]
        .pop();


    state.silasHand
      .push(
        chosen
      );


    setLastMove(
      'Silas',

      'nimmt '
      +
      names[chosen.type]
      +
      ' von Ablage '
      +
      (
        index===0
        ? 'A'
        : 'B'
      )
      +
      '.'
    );
  }
}


/* =========================
   SILAS DUOS
========================= */

function silasPlayDuos(
  allowBoatExtra=true
){

  let changed=true;


  while(changed){

    changed=false;


    /* Boot */

    if(
      countType(
        state.silasHand,
        'boat'
      )>=2
    ){

      const pair=
        removePairFrom(
          state.silasHand,
          'boat',
          'boat'
        );


      if(pair){

        state.silasPlayed
          .push(
            ...pair
          );


        if(
          allowBoatExtra
        ){

          state.silasExtra=
            true;
        }


        setLastMove(
          'Silas',

          'spielt ein Boot-Duo und bekommt einen Extra-Zug.'
        );


        changed=true;

        continue;
      }
    }


    /* Fisch */

    if(
      countType(
        state.silasHand,
        'fish'
      )>=2
    ){

      const pair=
        removePairFrom(
          state.silasHand,
          'fish',
          'fish'
        );


      if(pair){

        state.silasPlayed
          .push(
            ...pair
          );


        if(
          state.deck.length
        ){

          const drawn=
            state.deck.pop();


          state.silasHand
            .push(
              drawn
            );


          setLastMove(
            'Silas',

            'spielt ein Fisch-Duo und zieht 1 zusätzliche Karte.'
          );
        }
        else{

          setLastMove(
            'Silas',

            'spielt ein Fisch-Duo. Der Nachziehstapel ist leer.'
          );
        }


        changed=true;

        continue;
      }
    }


    /* Hai + Schwimmer */

    if(
      countType(
        state.silasHand,
        'shark'
      )>=1
      &&
      countType(
        state.silasHand,
        'swimmer'
      )>=1
    ){

      const pair=
        removePairFrom(
          state.silasHand,
          'shark',
          'swimmer'
        );


      if(pair){

        state.silasPlayed
          .push(
            ...pair
          );


        if(
          state.hand.length
        ){

          const i=
            Math.floor(
              Math.random()*
              state.hand.length
            );


          const stolen=
            state.hand
              .splice(
                i,
                1
              )[0];


          state.silasHand
            .push(
              stolen
            );


          /*
            Auch bei Silas wird die
            gestohlene Karte ausdrücklich genannt.
          */
          setLastMove(
            'Silas',

            'spielt Hai + Schwimmer und stiehlt '
            +
            playerName()
            +
            ' '
            +
            names[stolen.type]
            +
            '.'
          );
        }
        else{

          setLastMove(
            'Silas',

            'spielt Hai + Schwimmer, aber '
            +
            playerName()
            +
            ' hat keine Karte zum Stehlen.'
          );
        }


        changed=true;

        continue;
      }
    }


    /* Mr Krabs */

    if(
      countType(
        state.silasHand,
        'crab'
      )>=2
    ){

      const pair=
        removePairFrom(
          state.silasHand,
          'crab',
          'crab'
        );


      if(pair){

        state.silasPlayed
          .push(
            ...pair
          );


        const possible=[];


        if(
          state.piles[0]
            .length
        ){

          possible.push(
            0
          );
        }


        if(
          state.piles[1]
            .length
        ){

          possible.push(
            1
          );
        }


        if(
          possible.length
        ){

          const pile=
            possible[
              Math.floor(
                Math.random()*
                possible.length
              )
            ];


          let bestIndex=0;

          let bestValue=-999;


          state.piles[
            pile
          ]
          .forEach(
            (card,i)=>{

              const value=
                silasCardValue(
                  card
                );


              if(
                value>
                bestValue
              ){

                bestValue=
                  value;


                bestIndex=
                  i;
              }
            }
          );


          const chosen=
            state.piles[
              pile
            ]
            .splice(
              bestIndex,
              1
            )[0];


          state.silasHand
            .push(
              chosen
            );


          setLastMove(
            'Silas',

            'spielt ein Mr-Krabs-Duo und holt '
            +
            names[chosen.type]
            +
            ' aus Ablage '
            +
            (
              pile===0
              ? 'A'
              : 'B'
            )
            +
            '.'
          );
        }
        else{

          setLastMove(
            'Silas',

            'spielt ein Mr-Krabs-Duo, aber beide Ablagen sind leer.'
          );
        }


        changed=true;

        continue;
      }
    }
  }
}


/* =========================
   SILAS ZUG
========================= */

function silasTurn(){

  if(
    !state.started ||
    state.roundOver ||
    state.gameOver
  ){

    return;
  }


  hideSpecialStatus();


  silasTakeOneCard();


  silasPlayDuos(
    true
  );


  if(
    hasFourMermaids(
      state.silasHand,
      state.silasPlayed
    )
  ){

    instantWin(
      'silas'
    );


    return;
  }


  render();


  if(
    state.silasExtra
  ){

    state.silasExtra=
      false;


    saveGame();


    setTimeout(
      silasTurn,
      700
    );


    return;
  }


  const sp=
    scoreCards(
      state.silasHand,
      state.silasPlayed
    );


  if(
    sp>=12
  ){

    setLastMove(
      'Silas',

      'sagt Stopp.'
    );


    finishRound(
      'stop',
      'silas'
    );


    return;
  }


  state.busy=false;

  state.turn=
    'you';

  state.phase=
    'draw';


  hideSpecialStatus();

  render();

  saveGame();
}


/* =========================
   RUNDENENDE
========================= */

function finishRound(
  mode,
  caller
){

  if(
    state.roundOver
  ){

    return;
  }


  state.roundOver=true;

  state.busy=true;


  const yp=
    scoreCards(
      state.hand,
      state.played
    );


  const sp=
    scoreCards(
      state.silasHand,
      state.silasPlayed
    );


  const yb=
    colorBonus(
      state.hand,
      state.played
    );


  const sb=
    colorBonus(
      state.silasHand,
      state.silasPlayed
    );


  let ya=0;

  let sa=0;

  let explain='';


  if(
    mode==='stop'
  ){

    ya=yp;

    sa=sp;


    explain=

      (
        caller==='you'
        ? playerName()
        : 'Silas'
      )

      +

      ' hat Stopp gesagt. Beide erhalten ihre Kartenpunkte.';
  }
  else if(
    caller==='you'
  ){

    if(
      yp>=sp
    ){

      ya=
        yp+yb;


      sa=
        sb;


      explain=

        playerName()
        +
        ' gewinnt die Letzte Chance und erhält Kartenpunkte plus Farbbonus. Silas erhält nur seinen Farbbonus.';
    }
    else{

      ya=
        yb;


      sa=
        sp;


      explain=

        playerName()
        +
        ' verliert die Letzte Chance und erhält nur den Farbbonus. Silas erhält seine Kartenpunkte.';
    }
  }
  else{

    if(
      sp>=yp
    ){

      sa=
        sp+sb;


      ya=
        yb;


      explain=

        'Silas gewinnt die Letzte Chance und erhält Kartenpunkte plus Farbbonus. '
        +
        playerName()
        +
        ' erhält nur den Farbbonus.';
    }
    else{

      sa=
        sb;


      ya=
        yp;


      explain=

        'Silas verliert die Letzte Chance und erhält nur den Farbbonus. '
        +
        playerName()
        +
        ' erhält die Kartenpunkte.';
    }
  }


  state.youTotal+=
    ya;


  state.silasTotal+=
    sa;


  state.resultTitle=
    'Rundenergebnis';


  state.resultHTML=

    `<div class="resultLine">

      <strong>
        ${playerName()}: ${yp} Kartenpunkte${mode==='last'?` · Farbbonus ${yb}`:''}
      </strong>

    </div>`

    +

    `<div class="resultLine">

      <strong>
        Silas: ${sp} Kartenpunkte${mode==='last'?` · Farbbonus ${sb}`:''}
      </strong>

    </div>`

    +

    `<div class="resultLine">

      <strong>
        Für diese Runde:
        ${playerName()} +${ya} ·
        Silas +${sa}
      </strong>

    </div>`

    +

    `<div class="resultLine sub">
      ${explain}
    </div>`;


  if(
    state.youTotal>=40
    ||
    state.silasTotal>=40
  ){

    state.gameOver=true;

    state.turn='none';

    state.phase='done';


    if(
      state.youTotal>
      state.silasTotal
    ){

      state.resultTitle=
        '🎉 '
        +
        playerName()
        +
        ' gewinnt die Partie!';


      showSpecialStatus(

        'Partie beendet – '
        +
        playerName()
        +
        ' gewinnt mit '
        +
        state.youTotal
        +
        ' zu '
        +
        state.silasTotal
        +
        '.'

      );
    }
    else if(
      state.silasTotal>
      state.youTotal
    ){

      state.resultTitle=
        'Silas gewinnt die Partie.';


      showSpecialStatus(

        'Partie beendet – Silas gewinnt mit '
        +
        state.silasTotal
        +
        ' zu '
        +
        state.youTotal
        +
        '.'

      );
    }
    else{

      state.resultTitle=
        'Unentschieden.';


      showSpecialStatus(

        'Partie beendet – Gleichstand '
        +
        state.youTotal
        +
        ' zu '
        +
        state.silasTotal
        +
        '.'

      );
    }
  }
  else{

    const nextName=

      state.nextStarter==='you'

      ? playerName()

      : 'Silas';


    showSpecialStatus(

      'Runde beendet. Gesamtstand: '
      +
      playerName()
      +
      ' '
      +
      state.youTotal
      +
      ' : '
      +
      state.silasTotal
      +
      ' Silas. Die nächste Runde beginnt '
      +
      nextName
      +
      '.'

    );
  }


  render();

  saveGame();
}


function stopRound(){

  if(
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action' ||
    score()<7
  ){

    return;
  }


  setLastMove(
    playerName(),

    'sagt Stopp.'
  );


  finishRound(
    'stop',
    'you'
  );
}


/* =========================
   LETZTE CHANCE
========================= */

function lastChance(){

  if(
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action' ||
    score()<7
  ){

    return;
  }


  state.busy=true;

  state.turn=
    'silas';


  setLastMove(
    playerName(),

    'sagt „Letzte Chance“.'
  );


  showSpecialStatus(

    'Letzte Chance! '
    +
    playerName()
    +
    's Hand ist fest. Silas bekommt genau einen letzten Zug.'

  );


  render();


  setTimeout(
    ()=>{

      silasTakeOneCard();


      silasPlayDuos(
        false
      );


      state.silasExtra=
        false;


      if(
        hasFourMermaids(
          state.silasHand,
          state.silasPlayed
        )
      ){

        instantWin(
          'silas'
        );


        return;
      }


      finishRound(
        'last',
        'you'
      );

    },
    700
  );
}


/* =========================
   4 MEERJUNGFRAUEN
========================= */

function instantWin(player){

  state.roundOver=true;

  state.gameOver=true;

  state.busy=true;

  state.turn='none';

  state.phase='done';


  if(
    player==='you'
  ){

    state.resultTitle=

      '🧜‍♀️🧜‍♀️🧜‍♀️🧜‍♀️ '

      +

      playerName()

      +

      ' gewinnt!';


    state.resultHTML=

      '<div class="resultLine"><strong>Vier Meerjungfrauen – Sofortsieg der gesamten Partie.</strong></div>';


    showSpecialStatus(

      'Vier Meerjungfrauen – '
      +
      playerName()
      +
      ' gewinnt die Partie sofort!'

    );
  }
  else{

    state.resultTitle=
      'Silas gewinnt mit vier Meerjungfrauen.';


    state.resultHTML=

      '<div class="resultLine"><strong>Silas hat alle vier Meerjungfrauen und gewinnt die gesamte Partie sofort.</strong></div>';


    showSpecialStatus(

      'Silas gewinnt die Partie sofort durch vier Meerjungfrauen.'

    );
  }


  render();

  saveGame();
}


/* =========================
   BUTTONS
========================= */

$('newBtn')
  .addEventListener(
    'click',
    newGame
  );


$('newRoundTopBtn')
  .addEventListener(
    'click',
    startRound
  );


$('changePlayerBtn')
  .addEventListener(
    'click',
    showNameSelection
  );


$('drawBtn')
  .addEventListener(
    'click',
    drawTwo
  );


$('pileA')
  .addEventListener(
    'click',
    ()=>takePile(
      0
    )
  );


$('pileB')
  .addEventListener(
    'click',
    ()=>takePile(
      1
    )
  );


$('endTurnBtn')
  .addEventListener(
    'click',
    endYourTurn
  );


$('stopBtn')
  .addEventListener(
    'click',
    stopRound
  );


$('chanceBtn')
  .addEventListener(
    'click',
    lastChance
  );


$('nextRoundBtn')
  .addEventListener(
    'click',
    startRound
  );


/* =========================
   START
========================= */

const restored=
  loadGame();


render();


if(
  !state.playerName
){

  showNameSelection();
}
else if(
  restored
  &&
  state.turn==='silas'
  &&
  !state.roundOver
  &&
  !state.gameOver
){

  /*
    Falls der Browser genau während
    Silas' Zug geschlossen wurde.
  */
  state.busy=true;

  render();


  setTimeout(
    silasTurn,
    700
  );
}

})();
