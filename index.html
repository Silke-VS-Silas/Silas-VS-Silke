<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JavaScript-Test</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      padding:30px;
      background:#f5f5f5;
    }
    button{
      font-size:22px;
      padding:18px 24px;
      border:0;
      border-radius:12px;
      background:#2b7a78;
      color:white;
      font-weight:bold;
    }
    #status{
      margin-top:25px;
      font-size:24px;
      font-weight:bold;
      color:#b00020;
    }
  </style>
</head>
<body>

  <h1>JavaScript-Test</h1>

  <button id="testBtn" type="button">Hier tippen</button>

  <div id="status">Noch nicht getestet</div>

  <script>
    document.getElementById('testBtn').addEventListener('click', function () {
      const status = document.getElementById('status');
      status.textContent = 'FUNKTIONIERT';
      status.style.color = 'green';
    });
  </script>

</body>
</html>
