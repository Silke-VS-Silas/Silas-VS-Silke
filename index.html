<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sea Salt & Paper – Version 9t</title>
<style>
:root{--bg:#f4efe6;--ink:#17212b;--muted:#68737d;--line:#d9d0c3;--red:#a82520;--green:#2f7d43;--cream:#fffdf8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7f3ec,#eee7dc);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:780px;margin:auto;padding:8px}.top,.head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.actions,.scores,.duos{display:flex;gap:7px;flex-wrap:wrap}h1{font-size:24px;margin:0}.sub{font-size:12px;color:var(--muted)}.scores{font-size:17px;font-weight:800}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;min-height:42px;font-weight:700}.btn:disabled{opacity:.35}.red{background:var(--red);border-color:var(--red);color:#fff}.green{background:var(--green);border-color:var(--green);color:#fff}.duo{background:#fff1d8;border-color:#dfbd80}.box,.status,.choice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:9px}.status{background:#edf7f2;border-color:#c7ded2;font-weight:700}.hidden{display:none!important}.backrow,.played{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.back{width:26px;height:37px;border-radius:6px;background:#28506b;color:#fff;display:flex;align-items:center;justify-content:center}.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.zone{border:1px solid var(--line);border-radius:14px;background:#fff;padding:6px;min-height:112px}.zone h2{font-size:13px;color:var(--muted);margin:0 0 5px}.deck{text-align:center}.wave{font-size:34px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.card{--c:#ddd;position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 55%,#b9b6af);border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 22%,white) 0%,color-mix(in srgb,var(--c) 10%,white) 100%);height:116px;min-height:116px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.08)}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}.card:after{content:"";position:absolute;inset:8px 0 auto 0;height:28px;background:linear-gradient(120deg,transparent 0 62%,rgba(255,255,255,.34) 62% 74%,transparent 74%);pointer-events:none}.chead{display:flex;align-items:center;gap:5px;margin-top:4px;position:relative;z-index:2}.mark{width:12px;height:12px;border-radius:50%;background:var(--c);border:1px solid #777;flex:0 0 auto}.name{font-size:12px;font-weight:900;line-height:1.05}.art{display:flex;align-items:center;justify-content:center;height:34px;min-height:34px;position:relative;z-index:1}.ico{font-size:31px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.65))}.sea{width:29px;height:36px;object-fit:contain;display:block}.rule{font-size:9px;line-height:1.15;font-weight:700}.foot{display:flex;justify-content:space-between;font-size:9px;color:#56616a;position:relative;z-index:2}.special{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 36%,white) 0%,color-mix(in srgb,var(--c) 20%,white) 100%);border:2px solid color-mix(in srgb,var(--c) 72%,#5d6670);padding-top:8px}.special:before{height:100%;opacity:.11;background:var(--c)}.special:after{inset:0;background:linear-gradient(135deg,rgba(255,255,255,.42) 0 24%,transparent 24% 57%,rgba(255,255,255,.20) 57% 70%,transparent 70%);height:100%}.special .chead{padding-right:39px}.special .name{color:#173b63;font-size:12.5px;letter-spacing:.01em}.special .rule{color:#173b63;font-size:9.5px;font-weight:900}.special .art{height:34px;min-height:34px}.specialBadge{position:absolute;right:6px;top:6px;z-index:4;width:37px;height:37px;border-radius:7px;background:rgba(255,255,255,.93);border:1px solid rgba(23,59,99,.24);box-shadow:0 1px 2px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#173b63;line-height:1}.specialBadge .mult{font-size:10px;font-weight:900}.specialBadge .target{font-size:16px;margin-top:1px}.mini{width:86px;height:94px;min-height:94px;padding:6px}.mini .ico{font-size:25px}.mini .sea{width:24px;height:30px}.mini.special .name{font-size:10.5px}.mini .specialBadge{width:31px;height:31px;right:4px;top:4px}.mini .specialBadge .target{font-size:13px}.mini .specialBadge .mult{font-size:8px}.mini .last ul{margin:5px 0 0;padding-left:20px}.points{font-weight:800}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:999}.dialog{width:min(420px,100%);background:#fff;border-radius:18px;padding:18px}.names{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Sea Salt & Paper</h1><div class="sub">Version 9t · Seepferdchen direkt eingebaut</div></div>
    <div class="scores"><span><span id="pname">Spieler</span>: <span id="ys">0</span></span><span>Silas: <span id="ss">0</span></span></div>
    <div class="actions"><button id="new" class="btn red" type="button">Neues Spiel</button><button id="round" class="btn green" type="button">Neue Runde</button><button id="change" class="btn" type="button">Spieler wechseln</button></div>
  </div>
  <div id="status" class="status hidden"></div>
  <div class="box"><div class="head"><div><strong>Silas</strong><div class="sub">Verdeckte Hand: <span id="sc">0</span> Karten</div></div></div><div id="sback" class="backrow"></div><div style="margin-top:9px"><strong>Silas ausgespielt</strong></div><div id="splayed" class="played"></div></div>
  <div class="box last"><strong>Letzter Zug</strong><div id="last">Noch kein Zug.</div></div>
  <div class="board">
    <button id="draw" class="zone deck" type="button" disabled><div class="wave">🌊</div><strong id="drawlabel">2 Karten ziehen</strong><div class="sub"><span id="dc">0</span> übrig</div></button>
    <button id="pa" class="zone" type="button" disabled><h2>Ablage A</h2><div id="pac">leer</div></button>
    <button id="pb" class="zone" type="button" disabled><h2>Ablage B</h2><div id="pbc">leer</div></button>
  </div>
  <div id="choice" class="choice hidden"><strong id="ct"></strong><div id="cg" class="choicegrid"></div></div>
  <div class="box"><div class="head"><div><strong>Deine Hand</strong><div class="points">Punkte: <span id="yp">0</span></div></div><div class="actions"><button id="end" class="btn green" type="button" disabled>Zug beenden</button><button id="stop" class="btn" type="button" disabled>Stopp</button><button id="chance" class="btn duo" type="button" disabled>Letzte Chance</button></div></div><div id="hand" class="grid"></div><div id="duos" class="duos"></div></div>
  <div class="box"><strong>Deine ausgespielten Duos / Trios</strong><div id="played" class="played"></div></div>
  <div id="result" class="box hidden"><strong id="rt">Rundenergebnis</strong><div id="rtext"></div><div style="margin-top:10px"><strong>Silas deckt auf</strong></div><div id="reveal" class="grid"></div><button id="next" class="btn green" type="button" style="margin-top:10px">Nächste Runde</button></div>
</div>

<div id="overlay" class="overlay hidden"><div class="dialog"><h2>Wer spielt gegen Silas?</h2><div class="sub">Wähle deinen Spielernamen.</div><div class="names"><button class="btn nbtn" data-n="Silke" type="button">Silke</button><button class="btn nbtn" data-n="Karin" type="button">Karin</button><button class="btn nbtn" data-n="Stinker" type="button">Stinker</button><button class="btn nbtn" data-n="Dicke Hummel" type="button">Dicke Hummel</button></div></div></div>

<script>
(()=>{'use strict';

const $=id=>document.getElementById(id),SAVE='ssap-v9p',PKEY='sea-salt-player-name';

const SEA=`<svg class="sea" viewBox="0 0 80 120" xmlns="http://www.w3.org/2000/svg" aria-label="Blaues Seepferdchen" role="img">
<path fill="#2f86c9" d="M49 7c-11 0-20 8-20 18 0 7 4 13 10 16-9 5-14 14-14 24 0 16 12 27 24 29 7 1 12-2 12-8 0-6-5-9-10-8-4 1-6 5-5 9-9-3-14-11-14-21 0-11 6-19 16-23 11-4 18-12 18-22C66 13 59 7 49 7Z"/>
<circle cx="54" cy="20" r="3.7" fill="#0b2d50"/>
<path fill="#1f6cae" d="M39 40c-10 4-16 12-17 22 9-5 16-4 21 3 0-11 4-18 12-23-5-3-10-4-16-2Z"/>
<path fill="#78c9ff" d="M31 26c-8 0-14 5-14 11 7-2 13 0 18 5 1-7-1-12-4-16Z"/>
<path fill="#145fa8" d="M28 91c-6 6-7 15-2 21 4 5 11 5 16 1 4-3 5-9 2-13-2-4-7-5-11-3 2-4 0-7-5-6Z"/>
<path fill="#9bd7ff" d="M48 33c6 1 10-2 12-7-6 3-11 3-16 0 0 4 1 6 4 7Z"/>
</svg>`;

const N={crab:'Mr Krabs',boat:'Boot',fish:'Fisch',shark:'Hai',swimmer:'Schwimmer',shell:'Muschel',octopus:'Oktopus',penguin:'Pinguin',sailor:'Anker',mermaid:'Meerjungfrau',lighthouse:'eine pro Boot',shoal:'ein pro Fisch',colony:'zwei pro Pinguin',captain:'drei pro Anker',jellyfish:'Qualle',lobster:'Hummer',crabBasket:'eine pro Mr Krabs',starfish:'Seestern',seahorse:'Seepferdchen'};

const I={crab:'🦀',boat:'⛵',fish:'🐟',shark:'🦈',swimmer:'🏊',shell:'🐚',octopus:'🐙',penguin:'🐧',sailor:'⚓',mermaid:'🧜‍♀️',lighthouse:'🗼',shoal:'🐟',colony:'🐧',captain:'🧭',jellyfish:'🪼',lobster:'🦞',crabBasket:'🧺',starfish:'⭐'};

const R={crab:'2 = 1 Pkt · Ablage durchsuchen',boat:'2 = 1 Pkt · Extra-Zug',fish:'2 = 1 Pkt · 1 Karte ziehen',shark:'Hai + Schwimmer = 1 Pkt · Karte stehlen',swimmer:'Hai/Qualle + Schwimmer = 1 Pkt',shell:'2=2 · 3=4 · 4=6 · 5=8 · 6=10',octopus:'2=3 · 3=6 · 4=9 · 5=12',penguin:'1=1 · 2=3 · 3=5',sailor:'2 = 5 Punkte',lighthouse:'+1 je Boot',shoal:'+1 je Fisch',colony:'+2 je Pinguin',captain:'+3 je Anker',mermaid:'Wertet häufigste Farbe · 4 = Sofortsieg',jellyfish:'Qualle + Schwimmer = 1 Pkt · Gegner nur 1 Karte',lobster:'Hummer + Mr Krabs = 1 Pkt · Top 5, 1 wählen',crabBasket:'+1 je Mr Krabs',starfish:'Duo + Seestern = 3 Pkt · Effekt entfällt',seahorse:'ersetzt 1 Sammelkarte · mind. 1 echte'};

const CN={darkblue:'Dunkelblau',turquoise:'Hellblau',yellow:'Gelb',black:'Schwarz',green:'Hellgrün',gray:'Hellgrau',lavender:'Lila',pink:'Hellrosa',peach:'Hellorange',orange:'Orange',white:'Weiß'};

const CH={darkblue:'#356b93',turquoise:'#73c3cc',yellow:'#e6ca48',black:'#4f5154',green:'#9acb83',gray:'#c8c9cb',lavender:'#9a80b9',pink:'#e59eb8',peach:'#eab385',orange:'#df7c2f',white:'#f7f4eb'};

const C={crab:9,boat:8,fish:7,shark:5,swimmer:5,shell:6,octopus:5,penguin:3,sailor:2,lighthouse:1,shoal:1,colony:1,captain:1,mermaid:4,jellyfish:2,lobster:1,crabBasket:1,starfish:3,seahorse:1};

const sp=(t,a)=>a.map(color=>({type:t,color}));

const BASE=[
...sp('crab',['darkblue','darkblue','turquoise','turquoise','black','yellow','yellow','green','gray']),
...sp('boat',['darkblue','darkblue','turquoise','turquoise','black','black','yellow','yellow']),
...sp('fish',['darkblue','darkblue','turquoise','black','black','yellow','green']),
...sp('swimmer',['darkblue','turquoise','black','yellow','peach']),
...sp('shark',['darkblue','turquoise','black','green','lavender']),
...sp('shell',['darkblue','turquoise','black','yellow','green','gray']),
...sp('octopus',['turquoise','yellow','green','gray','lavender']),
...sp('penguin',['pink','peach','lavender']),
...sp('sailor',['pink','orange']),
{type:'lighthouse',color:'lavender'},
{type:'shoal',color:'gray'},
{type:'colony',color:'green'},
{type:'captain',color:'peach'},
...sp('mermaid',['white','white','white','white'])
];

const EXTRA=[
...sp('starfish',['darkblue','turquoise','yellow']),
...sp('jellyfish',['pink','lavender']),
{type:'lobster',color:'black'},
{type:'crabBasket',color:'green'},
{type:'seahorse',color:'white'}
];

let uid=1;

const S={deck:[],piles:[[],[]],hand:[],sh:[],played:[],sp:[],yt:0,st:0,started:false,busy:false,roundOver:true,gameOver:false,turn:'none',phase:'draw',next:'you',starter:'you',wait:false,name:null,lastWho:'',last:[],msg:'',yj:false,sj:false,sExtra:false,result:''};

const safe=v=>Number.isFinite(Number(v))?Number(v):0,arr=v=>Array.isArray(v)?v.filter(Boolean):[];

function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function deck(){return shuffle([...BASE,...EXTRA].map(x=>({id:uid++,...x})))}

function save(){try{localStorage.setItem(SAVE,JSON.stringify({uid,S}));if(S.name)localStorage.setItem(PKEY,S.name)}catch(e){}}

function load(){try{const raw=localStorage.getItem(SAVE);if(!raw){S.name=localStorage.getItem(PKEY)||null;return false}const x=JSON.parse(raw);if(!x?.S)return false;Object.assign(S,x.S);uid=safe(x.uid)||1;S.deck=arr(S.deck);S.hand=arr(S.hand);S.sh=arr(S.sh);S.played=arr(S.played);S.sp=arr(S.sp);S.piles=Array.isArray(S.piles)?[arr(S.piles[0]),arr(S.piles[1])]:[[],[]];S.yt=safe(S.yt);S.st=safe(S.st);S.last=arr(S.last);S.name=S.name||localStorage.getItem(PKEY)||'Silke';S.busy=false;return true}catch(e){return false}}

const pname=()=>S.name||'Spieler',ct=(a,t)=>arr(a).filter(c=>c.type===t).length;

const tbl={shell:[0,0,2,4,6,8,10],octopus:[0,0,3,6,9,12],penguin:[0,1,3,5],sailor:[0,0,5]};

function cscore(t,n){const a=tbl[t];return a?safe(a[Math.min(Math.max(0,n),a.length-1)]):0}

function seaGain(cards){let best=0;for(const [t,m] of Object.entries({shell:6,octopus:5,penguin:3,sailor:2})){const n=ct(cards,t);if(n>=1&&n<m)best=Math.max(best,cscore(t,n+1)-cscore(t,n))}return best}

function score(h,p){const a=[...arr(h),...arr(p)];let v=Math.floor(ct(a,'crab')/2)+Math.floor(ct(a,'boat')/2)+Math.floor(ct(a,'fish')/2)+Math.min(ct(a,'swimmer'),ct(a,'shark')+ct(a,'jellyfish'));if(ct(a,'lobster')&&ct(a,'crab')%2)v++;for(const t of ['shell','octopus','penguin','sailor'])v+=cscore(t,ct(a,t));if(ct(a,'seahorse'))v+=seaGain(a);if(ct(a,'lighthouse'))v+=ct(a,'boat');if(ct(a,'shoal'))v+=ct(a,'fish');if(ct(a,'colony'))v+=2*ct(a,'penguin');if(ct(a,'captain'))v+=3*ct(a,'sailor');if(ct(a,'crabBasket'))v+=ct(a,'crab');v+=2*ct(p,'starfish');const m=ct(a,'mermaid');if(m){const f={};a.forEach(c=>f[c.color]=(f[c.color]||0)+1);const vals=Object.values(f).sort((x,y)=>y-x);for(let i=0;i<m;i++)v+=vals[i]||0}return safe(v)}

function bonus(h,p){const f={};[...arr(h),...arr(p)].forEach(c=>f[c.color]=(f[c.color]||0)+1);const v=Object.values(f);return v.length?Math.max(...v):0}

const yscore=()=>score(S.hand,S.played),four=(h,p)=>ct([...arr(h),...arr(p)],'mermaid')>=4;

function log(w,t){if(S.lastWho!==w){S.lastWho=w;S.last=[]}S.last.push(t);save()}

function show(t){S.msg=t;render()} function hide(){S.msg=''}

function top(i){const p=S.piles[i];return p[p.length-1]||null}

const SPECIAL={lighthouse:{m:'+1',i:'⛵'},shoal:{m:'+1',i:'🐟'},colony:{m:'+2',i:'🐧'},captain:{m:'+3',i:'⚓'},crabBasket:{m:'+1',i:'🦀'}};

function card(c,mini=false){if(!c)return'';const art=c.type==='seahorse'?SEA:`<div class="ico">${I[c.type]||'🃏'}</div>`;const spc=SPECIAL[c.type];const cls=`card${mini?' mini':''}${spc?' special':''}`;const badge=spc?`<div class="specialBadge"><span class="mult">${spc.m}</span><span class="target">${spc.i}</span></div>`:'';const tag='';return `<div class="${cls}" style="--c:${CH[c.color]||'#ddd'}">${badge}<div><div class="chead"><span class="mark"></span><span class="name">${N[c.type]}</span></div>${tag}<div class="art">${art}</div><div class="rule">${R[c.type]||''}</div></div><div class="foot"><span>${CN[c.color]}</span><span>×${C[c.type]||1}</span></div></div>`}

function defs(h){return[{k:'crab',l:'Mr-Krabs-Duo',a:'crab',b:'crab'},{k:'boat',l:'Boot-Duo',a:'boat',b:'boat'},{k:'fish',l:'Fisch-Duo',a:'fish',b:'fish'},{k:'shark',l:'Hai + Schwimmer',a:'shark',b:'swimmer'},{k:'jellyfish',l:'Qualle + Schwimmer',a:'jellyfish',b:'swimmer'},{k:'lobster',l:'Hummer + Mr Krabs',a:'lobster',b:'crab'}].filter(d=>d.a===d.b?ct(h,d.a)>=2:ct(h,d.a)&&ct(h,d.b))}

function render(){
$('pname').textContent=pname();$('ys').textContent=S.yt;$('ss').textContent=S.st;$('dc').textContent=S.deck.length;$('yp').textContent=yscore();$('sc').textContent=S.sh.length;$('sback').innerHTML=S.sh.map(()=>'<div class="back">✦</div>').join('');$('splayed').innerHTML=S.sp.length?S.sp.map(c=>card(c,true)).join(''):'<span class="sub">Noch nichts ausgespielt.</span>';if(S.lastWho&&S.last.length)$('last').innerHTML=`<strong>${S.lastWho}:</strong><ul>${S.last.map(x=>`<li>${x}</li>`).join('')}</ul>`;else $('last').textContent='Noch kein Zug.';$('status').classList.toggle('hidden',!S.msg);$('status').textContent=S.msg;const a=top(0),b=top(1);$('pac').innerHTML=a?card(a):'leer';$('pbc').innerHTML=b?card(b):'leer';$('hand').innerHTML=S.hand.length?S.hand.map(c=>card(c)).join(''):'<span class="sub">Noch keine Karten.</span>';$('played').innerHTML=S.played.length?S.played.map(c=>card(c,true)).join(''):'<span class="sub">Noch nichts ausgespielt.</span>';const yt=S.started&&!S.busy&&!S.roundOver&&!S.gameOver&&S.turn==='you',dr=yt&&S.phase==='draw',ac=yt&&S.phase==='action';$('drawlabel').textContent=dr&&S.yj?'1 Karte ziehen':'2 Karten ziehen';$('draw').disabled=!dr||S.deck.length<(S.yj?1:2);$('pa').disabled=!dr||S.yj||!a;$('pb').disabled=!dr||S.yj||!b;$('end').disabled=!ac||S.yj;const ok=yscore()>=7;$('stop').disabled=!ac||!ok||S.yj;$('chance').disabled=!ac||!ok||S.yj;$('round').disabled=!S.started||S.gameOver;$('duos').innerHTML='';if(ac&&!S.yj){const ds=defs(S.hand);ds.forEach(d=>{const b=document.createElement('button');b.className='btn duo';b.textContent=d.l+' ausspielen';b.onclick=()=>playDuo(d);$('duos').appendChild(b)});if(ct(S.hand,'starfish'))ds.forEach(d=>{const b=document.createElement('button');b.className='btn duo';b.textContent='Seestern + '+d.l+' = 3 Pkt';b.onclick=()=>playStar(d);$('duos').appendChild(b)})}if(S.roundOver&&S.result){$('result').classList.remove('hidden');$('rt').textContent=S.gameOver?'Partie beendet':'Rundenergebnis';$('rtext').innerHTML=S.result;const all=[...S.sh,...S.sp];$('reveal').innerHTML=all.map(c=>card(c)).join('');$('next').classList.toggle('hidden',S.gameOver)}else $('result').classList.add('hidden')}

function choose(title,opts){S.busy=true;$('ct').textContent=title;$('cg').innerHTML='';$('choice').classList.remove('hidden');opts.forEach(o=>{const b=document.createElement('button');b.className='btn';b.innerHTML=o.html||o.label;b.onclick=o.fn;$('cg').appendChild(b)});render()}

function closeChoice(){S.busy=false;$('choice').classList.add('hidden');$('cg').innerHTML='';render()}

function startRound(){if(S.gameOver){show('Die Partie ist beendet. Bitte „Neues Spiel“ drücken.');return}const st=S.next||'you';S.starter=st;S.next=st==='you'?'silas':'you';S.deck=deck();S.piles=[[],[]];S.hand=[];S.sh=[];S.played=[];S.sp=[];S.started=true;S.roundOver=false;S.turn=st;S.phase='draw';S.wait=false;S.yj=false;S.sj=false;S.sExtra=false;S.result='';S.lastWho='';S.last=[];S.piles[0].push(S.deck.pop());S.piles[1].push(S.deck.pop());if(st==='you'){S.busy=false;show(pname()+' beginnt diese Runde.');save()}else{S.busy=true;show('Silas beginnt diese Runde.');choose('Silas beginnt diese Runde. Schau dir Ablage A und B in Ruhe an.',[{label:'OK – Silas ist dran',fn:()=>{S.wait=false;closeChoice();S.busy=true;hide();render();save();setTimeout(silasTurn,400)}}]);S.wait=true;save()}render()}

function newGame(){S.yt=0;S.st=0;S.gameOver=false;S.started=false;S.roundOver=true;S.next='you';S.msg='';startRound()}

function selectName(n){S.name=n;try{localStorage.setItem(PKEY,n)}catch(e){}$('overlay').classList.add('hidden');newGame()}

function drawTwo(){if(S.deck.length<2||S.busy||S.turn!=='you'||S.phase!=='draw')return;const a=S.deck.pop(),b=S.deck.pop();choose('Welche Karte möchtest du behalten?',[{html:card(a),fn:()=>pick(a,b)},{html:card(b),fn:()=>pick(b,a)}])}

function pick(k,d){const ea=!S.piles[0].length,eb=!S.piles[1].length;if(ea||eb){const i=ea?0:1;S.hand.push(k);S.piles[i].push(d);closeChoice();log(pname(),`behält ${N[k.type]}. ${N[d.type]} wird automatisch auf Ablage ${i?'B':'A'} gelegt.`);afterGain();return}choose(N[d.type]+' ablegen auf …',[{label:'Ablage A',fn:()=>{S.hand.push(k);S.piles[0].push(d);closeChoice();log(pname(),`behält ${N[k.type]} und legt ${N[d.type]} auf Ablage A.`);afterGain()}},{label:'Ablage B',fn:()=>{S.hand.push(k);S.piles[1].push(d);closeChoice();log(pname(),`behält ${N[k.type]} und legt ${N[d.type]} auf Ablage B.`);afterGain()}}])}

function take(i){if(S.busy||S.turn!=='you'||S.phase!=='draw'||S.yj)return;const c=S.piles[i].pop();if(!c)return;S.hand.push(c);log(pname(),`nimmt ${N[c.type]} von Ablage ${i?'B':'A'}.`);afterGain()}

function afterGain(){if(four(S.hand,S.played)){instant('you');return}S.phase='action';hide();render();save()}

function remPair(h,a,b){const i=h.findIndex(c=>c.type===a);if(i<0)return null;const c1=h.splice(i,1)[0],j=h.findIndex(c=>c.type===b);if(j<0){h.push(c1);return null}return[c1,h.splice(j,1)[0]]}

function remOne(h,t){const i=h.findIndex(c=>c.type===t);return i<0?null:h.splice(i,1)[0]}

function playStar(d){const s=remOne(S.hand,'starfish'),p=remPair(S.hand,d.a,d.b);if(!s||!p){if(s)S.hand.push(s);return}S.played.push(...p,s);log(pname(),`spielt ${d.l} + Seestern als Trio: 3 Punkte, Duo-Effekt entfällt.`);render();save()}

function playDuo(d){const p=remPair(S.hand,d.a,d.b);if(!p)return;S.played.push(...p);if(d.k==='boat'){S.phase='draw';log(pname(),'spielt ein Boot-Duo und bekommt einen Extra-Zug.');render();save();return}if(d.k==='fish'){if(S.deck.length){const c=S.deck.pop();S.hand.push(c);log(pname(),`spielt ein Fisch-Duo und zieht ${N[c.type]}.`)}render();save();return}if(d.k==='shark'){if(S.sh.length){const i=Math.floor(Math.random()*S.sh.length),c=S.sh.splice(i,1)[0];S.hand.push(c);log(pname(),`spielt Hai + Schwimmer und stiehlt Silas ${N[c.type]}.`)}render();save();return}if(d.k==='jellyfish'){S.sj=true;log(pname(),'spielt Qualle + Schwimmer. Silas darf nur 1 Karte ziehen.');render();save();return}if(d.k==='lobster'){lobsterYou();return}if(d.k==='crab'){crabYou()}}

function lobsterYou(){const n=Math.min(5,S.deck.length);if(!n){render();return}const seen=[];for(let i=0;i<n;i++)seen.push(S.deck.pop());choose(`Hummer + Mr Krabs: Wähle 1 Karte aus ${n}.`,seen.map(c=>({html:card(c),fn:()=>{S.hand.push(c);S.deck=shuffle(S.deck.concat(seen.filter(x=>x.id!==c.id)));closeChoice();log(pname(),`spielt Hummer + Mr Krabs und wählt ${N[c.type]}.`);afterGain()}})))}

function crabYou(){choose('Mr Krabs: Welchen Ablagestapel durchsuchen?',[{label:'Stapel A',fn:()=>crabPile(0)},{label:'Stapel B',fn:()=>crabPile(1)}])}

function crabPile(i){$('ct').textContent='Mr Krabs – wähle eine Karte aus Stapel '+(i?'B':'A');$('cg').innerHTML='';if(!S.piles[i].length){const b=document.createElement('button');b.className='btn';b.textContent='Stapel ist leer';b.onclick=()=>closeChoice();$('cg').appendChild(b);return}S.piles[i].slice().reverse().forEach(c=>{const b=document.createElement('button');b.className='btn';b.innerHTML=card(c);b.onclick=()=>{const x=S.piles[i].findIndex(z=>z.id===c.id);S.hand.push(S.piles[i].splice(x,1)[0]);closeChoice();log(pname(),`spielt Mr-Krabs-Duo und holt ${N[c.type]} aus Ablage ${i?'B':'A'}.`);render();save()};$('cg').appendChild(b)})}

function endTurn(){if(S.busy||S.turn!=='you'||S.phase!=='action')return;S.turn='silas';S.phase='draw';S.busy=true;hide();render();setTimeout(silasTurn,500)}

function val(c){if(!c)return 0;const n=t=>ct(S.sh,t),a=[...S.sh,...S.sp],tot=t=>ct(a,t);if(c.type==='mermaid')return 8;if(c.type==='penguin')return n('penguin')?5.5:4.3;if(c.type==='shell')return n('shell')?4.5:.2;if(c.type==='octopus')return n('octopus')?5.2:1.5;if(c.type==='sailor')return n('sailor')?6.5:.5;if(c.type==='starfish')return defs(S.sh).length?5:.7;if(c.type==='lobster')return n('crab')?5.8:1;if(c.type==='jellyfish')return n('swimmer')?6:1.2;if(c.type==='crab')return n('crab')||n('lobster')?5.5:1.4;if(c.type==='boat')return(n('boat')?6:1.8)+(tot('lighthouse')?1.5:0);if(c.type==='fish')return(n('fish')?5.7:1.8)+(tot('shoal')?1.5:0);if(c.type==='shark')return n('swimmer')?6:1.2;if(c.type==='swimmer')return n('shark')||n('jellyfish')?6:1.2;if(c.type==='seahorse')return seaGain(a)>0?3.5+seaGain(a):.5;return 2}

function silasTake(){const a=top(0),b=top(1),va=val(a),vb=val(b);if(Math.max(va,vb)>=4){const i=va>=vb?0:1,c=S.piles[i].pop();S.sh.push(c);log('Silas',`nimmt ${N[c.type]} von Ablage ${i?'B':'A'}.`);return}if(S.deck.length>=2){const x=S.deck.pop(),y=S.deck.pop(),k=val(x)>=val(y)?x:y,d=k===x?y:x;S.sh.push(k);const ea=!S.piles[0].length,eb=!S.piles[1].length,i=(ea||eb)?(ea?0:1):(Math.random()<.5?0:1);S.piles[i].push(d);log('Silas',`zieht 2 Karten und legt ${N[d.type]} auf Ablage ${i?'B':'A'}.`);return}const i=a&&!b?0:b&&!a?1:va>=vb?0:1;if(top(i)){const c=S.piles[i].pop();S.sh.push(c);log('Silas',`nimmt ${N[c.type]} von Ablage ${i?'B':'A'}.`)}}

function silasDuos(){let again=true;while(again){again=false;if(ct(S.sh,'boat')>=2){S.sp.push(...remPair(S.sh,'boat','boat'));S.sExtra=true;log('Silas','spielt ein Boot-Duo und bekommt einen Extra-Zug.');again=true;continue}if(ct(S.sh,'fish')>=2){S.sp.push(...remPair(S.sh,'fish','fish'));if(S.deck.length)S.sh.push(S.deck.pop());log('Silas','spielt ein Fisch-Duo und zieht 1 Karte.');again=true;continue}if(ct(S.sh,'shark')&&ct(S.sh,'swimmer')){S.sp.push(...remPair(S.sh,'shark','swimmer'));if(S.hand.length){const i=Math.floor(Math.random()*S.hand.length),c=S.hand.splice(i,1)[0];S.sh.push(c);log('Silas',`spielt Hai + Schwimmer und stiehlt ${pname()} ${N[c.type]}.`)}again=true;continue}if(ct(S.sh,'jellyfish')&&ct(S.sh,'swimmer')){S.sp.push(...remPair(S.sh,'jellyfish','swimmer'));S.yj=true;log('Silas',`spielt Qualle + Schwimmer. ${pname()} darf nur 1 Karte ziehen.`);again=true;continue}if(ct(S.sh,'crab')>=2){S.sp.push(...remPair(S.sh,'crab','crab'));const poss=[0,1].filter(i=>S.piles[i].length);if(poss.length){const i=poss[Math.floor(Math.random()*poss.length)],c=S.piles[i].pop();S.sh.push(c);log('Silas',`spielt Mr-Krabs-Duo und nimmt eine Karte aus Ablage ${i?'B':'A'}.`)}again=true;continue}}}

function blockedYou(){S.yj=false;if(S.deck.length)S.hand.push(S.deck.pop());log(pname(),'ist durch die Qualle blockiert und zieht 1 Karte.');S.turn='silas';S.busy=true;render();save();setTimeout(silasTurn,500)}

function silasTurn(){if(S.sj){S.sj=false;if(S.deck.length)S.sh.push(S.deck.pop());log('Silas','ist durch die Qualle blockiert und zieht 1 Karte.');S.busy=false;S.turn='you';S.phase='draw';render();save();return}silasTake();silasDuos();if(four(S.sh,S.sp)){instant('silas');return}if(S.sExtra){S.sExtra=false;render();save();setTimeout(silasTurn,500);return}if(score(S.sh,S.sp)>=12){log('Silas','sagt Stopp.');finish('stop');return}S.busy=false;S.turn='you';S.phase='draw';render();save()}

function finish(mode){if(S.roundOver)return;S.roundOver=true;const yp=score(S.hand,S.played),sp=score(S.sh,S.sp),yb=bonus(S.hand,S.played),sb=bonus(S.sh,S.sp);let ya=yp,sa=sp,txt='';if(mode==='last'){if(yp>=sp){ya=yp+yb;sa=sb;txt=`${pname()} gewinnt die Letzte Chance.`}else{ya=yb;sa=sp;txt=`${pname()} verliert die Letzte Chance.`}}else txt='Stopp: Beide erhalten ihre Kartenpunkte.';S.yt+=ya;S.st+=sa;S.result=`<div><strong>${pname()}: ${yp} Kartenpunkte${mode==='last'?` · Farbbonus ${yb}`:''}</strong></div><div><strong>Silas: ${sp} Kartenpunkte${mode==='last'?` · Farbbonus ${sb}`:''}</strong></div><div><strong>Runde: ${pname()} +${ya} · Silas +${sa}</strong></div><div class="sub">${txt}</div>`;if(S.yt>=40||S.st>=40){S.gameOver=true;S.turn='none';show(S.yt>S.st?`${pname()} gewinnt die Partie ${S.yt}:${S.st}.`:S.st>S.yt?`Silas gewinnt die Partie ${S.st}:${S.yt}.`:`Unentschieden ${S.yt}:${S.st}.`)}else show(`Runde beendet. Nächste Runde beginnt ${S.next==='you'?pname():'Silas'}.`);render();save()}

function lastChance(){if(yscore()<7)return;log(pname(),'sagt „Letzte Chance“.');S.busy=true;S.turn='silas';render();setTimeout(()=>{silasTake();silasDuos();S.sExtra=false;finish('last')},500)}

function instant(w){S.roundOver=true;S.gameOver=true;S.turn='none';S.result=`<div><strong>${w==='you'?pname():'Silas'} hat vier Meerjungfrauen und gewinnt sofort.</strong></div>`;show('Vier Meerjungfrauen – Sofortsieg!');render();save()}

$('new').onclick=newGame;
$('round').onclick=startRound;
$('change').onclick=()=>$('overlay').classList.remove('hidden');
$('draw').onclick=()=>S.yj?blockedYou():drawTwo();
$('pa').onclick=()=>take(0);
$('pb').onclick=()=>take(1);
$('end').onclick=endTurn;
$('stop').onclick=()=>{if(yscore()>=7){log(pname(),'sagt Stopp.');finish('stop')}};
$('chance').onclick=lastChance;
$('next').onclick=startRound;

document.querySelectorAll('.nbtn').forEach(b=>b.onclick=()=>selectName(b.dataset.n));

const restored=load();

render();

if(!S.name){
$('overlay').classList.remove('hidden');
}else if(restored&&S.turn==='silas'&&!S.roundOver&&!S.gameOver&&!S.wait){
S.busy=true;
render();
setTimeout(silasTurn,500);
}

})();
</script>
</body>
