<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silke gegen Silas – Version 6</title>

<style>
:root{
  --bg:#f6f3ec;
  --card:#fff;
  --ink:#17202a;
  --muted:#6c7680;
  --line:#d7d1c6;
  --accent:#2b7a78;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

h1{
  font-size:28px;
  margin:0;
}

.sub{
  color:var(--muted);
}

button{
  font:inherit;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:14px 18px;
  font-weight:700;
  min-height:48px;
}

.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.status{
  margin:16px 0;
  padding:14px;
  border:1px solid #c7dfdc;
  background:#edf7f6;
  border-radius:14px;
  font-weight:700;
}

.silasBox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
}

.silasHead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.backRow{
  display:flex;
  gap:5px;
  margin-top:10px;
  flex-wrap:wrap;
}

.backCard{
  width:34px;
  height:48px;
  border-radius:7px;
  background:#28506b;
  border:2px solid white;
  box-shadow:0 0 0 1px #28506b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:16px;
}

.board{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

.zone{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  min-height:170px;
}

.zone h2{
  font-size:15px;
  margin:0 0 10px;
  color:var(--muted);
}

.deck{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.wave{
  font-size:44px;
}

.card{
  border:1px solid rgba(0,0,0,.15);
  border-radius:14px;
  padding:12px;
  min-height:120px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.ico{
  font-size:34px;
}

.name{
  font-weight:800;
}

.meta{
  font-size:12px;
  color:#4e5963;
}

.darkblue{background:#cfe1f8}
.turquoise{background:#cff0ef}
.yellow{background:#faee9a}
.black{background:#dedfe2}
.green{background:#d9edcf}
.gray{background:#ececee}
.lavender{background:#e6d8f2}
.pink{background:#f4cedf}
.peach{background:#f4d3ba}
.orange{background:#f1b978}
.tan{background:#e8d8c1}
.white{background:#fff}

.choice{
  margin-top:16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.hidden{
  display:none;
}

.choiceGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.hand{
  margin-top:16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.handGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:10px;
}

@media(max-width:620px){
  .board{
    grid-template-columns:1fr;
  }

  .handGrid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div>
      <h1>Silke gegen Silas</h1>
      <div class="sub">Version 6 – Silas spielt mit</div>
    </div>

    <button id="newBtn" class="btn primary" type="button">
      Neue Partie
    </button>
  </div>

  <div id="status" class="status">
    Version 6 aktiv. Tippe auf „Neue Partie“.
  </div>

  <div class="silasBox">
    <div class="silasHead">
      <div>
        <strong>Silas</strong>
        <div class="sub">
          Verdeckte Hand:
          <span id="silasCount">0</span> Karten
        </div>
      </div>

      <div id="silasMove" class="sub">
        wartet
      </div>
    </div>

    <div id="silasCards" class="backRow"></div>
  </div>

  <div class="board">

    <button id="drawBtn" class="zone deck" type="button" disabled>
      <div class="wave">🌊</div>
      <strong>2 Karten ziehen</strong>
      <div class="sub">
        <span id="deckCount">0</span> Karten übrig
      </div>
    </button>

    <button id="pileA" class="zone" type="button" disabled>
      <h2>Ablage A</h2>
      <div id="pileAcard">leer</div>
    </button>

    <button id="pileB" class="zone" type="button" disabled>
      <h2>Ablage B</h2>
      <div id="pileBcard">leer</div>
    </button>

  </div>

  <div id="choiceBox" class="choice hidden">
    <strong id="choiceTitle"></strong>
    <div id="choiceGrid" class="choiceGrid"></div>
  </div>

  <div class="hand">
    <strong>Deine Hand</strong>
    <div id="handGrid" class="handGrid"></div>
  </div>

</div>

<script>
(() => {

'use strict';

const $ = id => document.getElementById(id);

const names = {
  crab:'Mr Krabs',
  boat:'Boot',
  fish:'Fisch',
  shark:'Hai',
  swimmer:'Schwimmer',
  shell:'Muschel',
  octopus:'Oktopus',
  penguin:'Pinguin',
  sailor:'Seemann',
  mermaid:'Meerjungfrau',
  lighthouse:'eine pro Boot',
  shoal:'ein pro Fisch',
  colony:'zwei pro Pinguin',
  captain:'Kapitän'
};

const icons = {
  crab:'🦀',
  boat:'⛵',
  fish:'🐟',
  shark:'🦈',
  swimmer:'🏊',
  shell:'🐚',
  octopus:'🐙',
  penguin:'🐧',
  sailor:'⚓',
  mermaid:'🧜‍♀️',
  lighthouse:'🗼',
  shoal:'🐟',
  colony:'🐧',
  captain:'🧭'
};

const colorNames = {
  darkblue:'Dunkelblau',
  turquoise:'Türkis',
  yellow:'Gelb',
  black:'Schwarz',
  green:'Grün',
  gray:'Grau',
  lavender:'Lila',
  pink:'Rosa',
  peach:'Pfirsich',
  orange:'Orange',
  tan:'Beige',
  white:'Weiß'
};

const typeCounts = {
  crab:9,
  boat:8,
  fish:7,
  shark:5,
  swimmer:5,
  shell:6,
  octopus:5,
  penguin:3,
  sailor:2,
  lighthouse:1,
  shoal:1,
  colony:1,
  captain:1,
  mermaid:4
};

const colorCounts = {
  darkblue:9,
  turquoise:9,
  yellow:8,
  black:8,
  green:6,
  gray:4,
  lavender:4,
  pink:2,
  peach:2,
  orange:1,
  tan:1,
  white:4
};

let uid = 1;

function shuffle(arr){

  const a = arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]] =
      [a[j],a[i]];
  }

  return a;
}

function makeDeck(){

  const types = [];

  Object.entries(typeCounts)
    .forEach(([type,n])=>{

      if(type !== 'mermaid'){

        for(let i=0;i<n;i++){
          types.push(type);
        }
      }
    });

  const colors = [];

  Object.entries(colorCounts)
    .forEach(([color,n])=>{

      if(color !== 'white'){

        for(let i=0;i<n;i++){
          colors.push(color);
        }
      }
    });

  const shuffledColors =
    shuffle(colors);

  const cards =
    types.map((type,i)=>({
      id:uid++,
      type:type,
      color:shuffledColors[i]
    }));

  for(let i=0;i<4;i++){

    cards.push({
      id:uid++,
      type:'mermaid',
      color:'white'
    });
  }

  return shuffle(cards);
}

const state = {

  deck:[],

  piles:[
    [],
    []
  ],

  hand:[],

  silasHand:[],

  started:false,

  busy:false,

  turn:'none'
};

function setStatus(text){

  $('status').textContent =
    text;
}

function topCard(index){

  const pile =
    state.piles[index];

  return (
    pile[pile.length-1] ||
    null
  );
}

function cardHTML(card){

  return `
    <div class="card ${card.color}">
      <div>
        <div class="ico">
          ${icons[card.type]}
        </div>

        <div class="name">
          ${names[card.type]}
        </div>
      </div>

      <div class="meta">
        ${colorNames[card.color]}
      </div>
    </div>
  `;
}

function renderSilas(){

  $('silasCount').textContent =
    state.silasHand.length;

  $('silasCards').innerHTML =
    '';

  state.silasHand.forEach(()=>{

    const back =
      document.createElement('div');

    back.className =
      'backCard';

    back.textContent =
      '✦';

    $('silasCards')
      .appendChild(back);
  });
}

function render(){

  $('deckCount').textContent =
    state.deck.length;

  const cardA =
    topCard(0);

  const cardB =
    topCard(1);

  $('pileAcard').innerHTML =
    cardA
      ? cardHTML(cardA)
      : 'leer';

  $('pileBcard').innerHTML =
    cardB
      ? cardHTML(cardB)
      : 'leer';

  $('handGrid').innerHTML =
    state.hand.length
      ? state.hand
          .map(cardHTML)
          .join('')
      : '<span class="sub">Noch keine Karten.</span>';

  renderSilas();

  const active =
    state.started &&
    !state.busy &&
    state.turn === 'you';

  $('drawBtn').disabled =
    !active ||
    state.deck.length < 2;

  $('pileA').disabled =
    !active ||
    !cardA;

  $('pileB').disabled =
    !active ||
    !cardB;
}

function closeChoice(){

  state.busy = false;

  $('choiceBox')
    .classList
    .add('hidden');

  $('choiceGrid')
    .innerHTML = '';

  render();
}

function showChoice(
  title,
  options
){

  state.busy = true;

  $('choiceTitle')
    .textContent = title;

  $('choiceGrid')
    .innerHTML = '';

  $('choiceBox')
    .classList
    .remove('hidden');

  options.forEach(option=>{

    const button =
      document
        .createElement('button');

    button.type =
      'button';

    button.className =
      'btn';

    button.innerHTML =
      option.html ||
      option.label;

    button.addEventListener(
      'click',
      option.onClick
    );

    $('choiceGrid')
      .appendChild(button);
  });

  render();
}

function newGame(){

  state.deck =
    makeDeck();

  state.piles =
    [
      [],
      []
    ];

  state.hand =
    [];

  state.silasHand =
    [];

  state.started =
    true;

  state.busy =
    false;

  state.turn =
    'you';

  state.piles[0]
    .push(
      state.deck.pop()
    );

  state.piles[1]
    .push(
      state.deck.pop()
    );

  $('silasMove')
    .textContent =
    'wartet';

  setStatus(
    'Neue Partie gestartet. Du bist dran.'
  );

  render();
}

function drawTwo(){

  if(
    state.deck.length < 2 ||
    state.busy ||
    state.turn !== 'you'
  ){
    return;
  }

  const first =
    state.deck.pop();

  const second =
    state.deck.pop();

  showChoice(
    'Welche Karte möchtest du behalten?',
    [
      {
        html:
          cardHTML(first),

        onClick:()=>{
          chooseDiscard(
            first,
            second
          );
        }
      },

      {
        html:
          cardHTML(second),

        onClick:()=>{
          chooseDiscard(
            second,
            first
          );
        }
      }
    ]
  );
}

function chooseDiscard(
  keep,
  discard
){

  showChoice(
    names[discard.type] +
    ' ablegen auf …',
    [
      {
        label:
          'Ablage A',

        onClick:()=>{

          state.hand
            .push(keep);

          state.piles[0]
            .push(discard);

          closeChoice();

          setStatus(
            'Du behältst ' +
            names[keep.type] +
            '.'
          );

          finishYourTurn();
        }
      },

      {
        label:
          'Ablage B',

        onClick:()=>{

          state.hand
            .push(keep);

          state.piles[1]
            .push(discard);

          closeChoice();

          setStatus(
            'Du behältst ' +
            names[keep.type] +
            '.'
          );

          finishYourTurn();
        }
      }
    ]
  );
}

function takePile(index){

  if(
    state.busy ||
    state.turn !== 'you'
  ){
    return;
  }

  const card =
    state.piles[index]
      .pop();

  if(!card){
    return;
  }

  state.hand
    .push(card);

  setStatus(
    'Du nimmst ' +
    names[card.type] +
    ' aus Ablage ' +
    (
      index===0
      ? 'A'
      : 'B'
    ) +
    '.'
  );

  render();

  finishYourTurn();
}

function finishYourTurn(){

  state.turn =
    'silas';

  state.busy =
    true;

  $('silasMove')
    .textContent =
    'ist dran …';

  setStatus(
    'Silas ist dran …'
  );

  render();

  setTimeout(
    silasTurn,
    700
  );
}

function countType(
  hand,
  type
){

  return hand
    .filter(
      card =>
        card.type === type
    )
    .length;
}

function silasCardValue(card){

  let value = 0;

  if(
    card.type === 'mermaid'
  ){
    value += 7;
  }

  if(
    card.type === 'penguin' ||
    card.type === 'octopus' ||
    card.type === 'shell' ||
    card.type === 'sailor'
  ){
    value += 4;
  }

  if(
    card.type === 'lighthouse' ||
    card.type === 'shoal' ||
    card.type === 'colony' ||
    card.type === 'captain'
  ){
    value += 3;
  }

  if(
    card.type === 'crab' ||
    card.type === 'boat' ||
    card.type === 'fish'
  ){

    if(
      countType(
        state.silasHand,
        card.type
      ) > 0
    ){
      value += 5;
    }
    else{
      value += 1;
    }
  }

  if(
    card.type === 'shark'
  ){

    if(
      countType(
        state.silasHand,
        'swimmer'
      ) > 0
    ){
      value += 5;
    }
  }

  if(
    card.type === 'swimmer'
  ){

    if(
      countType(
        state.silasHand,
        'shark'
      ) > 0
    ){
      value += 5;
    }
  }

  return value;
}

function silasTurn(){

  if(
    !state.started
  ){
    return;
  }

  const a =
    topCard(0);

  const b =
    topCard(1);

  const valueA =
    a
      ? silasCardValue(a)
      : -1;

  const valueB =
    b
      ? silasCardValue(b)
      : -1;

  const bestOpen =
    Math.max(
      valueA,
      valueB
    );

  if(
    bestOpen >= 4
  ){

    const index =
      valueA >= valueB
        ? 0
        : 1;

    const card =
      state.piles[index]
        .pop();

    state.silasHand
      .push(card);

    $('silasMove')
      .textContent =
      'nahm eine offene Karte';

  }
  else if(
    state.deck.length >= 2
  ){

    const first =
      state.deck.pop();

    const second =
      state.deck.pop();

    const firstValue =
      silasCardValue(first);

    const secondValue =
      silasCardValue(second);

    let keep;
    let discard;

    if(
      firstValue >=
      secondValue
    ){
      keep =
        first;

      discard =
        second;
    }
    else{
      keep =
        second;

      discard =
        first;
    }

    state.silasHand
      .push(keep);

    const pileIndex =
      Math.random() < 0.5
        ? 0
        : 1;

    state.piles[pileIndex]
      .push(discard);

    $('silasMove')
      .textContent =
      'zog zwei Karten';

  }
  else{

    let index = -1;

    if(a && b){

      index =
        valueA >= valueB
          ? 0
          : 1;

    }
    else if(a){

      index = 0;

    }
    else if(b){

      index = 1;
    }

    if(index >= 0){

      state.silasHand
        .push(
          state.piles[index]
            .pop()
        );

      $('silasMove')
        .textContent =
        'nahm eine offene Karte';
    }
  }

  state.busy =
    false;

  state.turn =
    'you';

  setStatus(
    'Silas ist fertig. Du bist dran.'
  );

  render();
}

$('newBtn')
  .addEventListener(
    'click',
    newGame
  );

$('drawBtn')
  .addEventListener(
    'click',
    drawTwo
  );

$('pileA')
  .addEventListener(
    'click',
    ()=>{
      takePile(0);
    }
  );

$('pileB')
  .addEventListener(
    'click',
    ()=>{
      takePile(1);
    }
  );

render();

})();
</script>

</body>
</html>
