<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silke gegen Silas – Version 9g</title>

<style>
:root{
  --bg:#f6f3ec;
  --ink:#17202a;
  --muted:#6c7680;
  --line:#d7d1c6;
  --accent2:#fff4df;
  --red:#b3261e;
  --green:#2e7d32;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  padding:7px;
}

.top,
.silasHead,
.handHead{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.topActions,
.scoreBoard,
.duoActions,
.endActions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

h1{
  font-size:24px;
  margin:0;
}

.sub{
  color:var(--muted);
  font-size:13px;
}

.scoreBoard{
  font-size:17px;
  font-weight:800;
}

button{
  font:inherit;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:10px 12px;
  font-weight:700;
  min-height:42px;
}

.redBtn{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

.greenBtn{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.duoBtn,
.chanceBtn{
  background:var(--accent2);
  border-color:#e3bd7f;
}

.btn:disabled{
  opacity:.35;
}

.status{
  margin:10px 0;
  padding:10px;
  border:1px solid #c7dfdc;
  background:#edf7f6;
  border-radius:11px;
  font-weight:700;
  font-size:14px;
}

.silasBox,
.hand,
.playedBox,
.resultBox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
  margin-top:9px;
}

.backRow{
  display:flex;
  gap:4px;
  margin-top:7px;
  flex-wrap:wrap;
}

.backCard{
  width:26px;
  height:37px;
  border-radius:6px;
  background:#28506b;
  border:1px solid #fff;
  box-shadow:0 0 0 1px #28506b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:12px;
}

.board{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.zone{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:6px;
  min-height:104px;
}

.zone h2{
  font-size:13px;
  margin:0 0 6px;
  color:var(--muted);
}

.deck{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.wave{
  font-size:32px;
}

.card{
  border:1px solid rgba(0,0,0,.15);
  border-radius:10px;
  padding:6px;
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.ico{
  font-size:23px;
  line-height:1.1;
}

.name{
  font-weight:800;
  font-size:12px;
  line-height:1.1;
}

.rule{
  font-size:10px;
  line-height:1.18;
  font-weight:700;
  margin-top:5px;
  color:#26323c;
}

.meta{
  font-size:10px;
  color:#4e5963;
  margin-top:5px;
}

.darkblue{background:#cfe1f8}
.turquoise{background:#cff0ef}
.yellow{background:#faee9a}
.black{background:#dedfe2}
.green{background:#d9edcf}
.gray{background:#ececee}
.lavender{background:#e6d8f2}
.pink{background:#f4cedf}
.peach{background:#f4d3ba}
.orange{background:#f1b978}
.tan{background:#e8d8c1}
.white{background:#fff}

.choice{
  margin-top:9px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
}

.hidden{
  display:none!important;
}

.choiceGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:7px;
}

.handGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-top:7px;
}

.playedGrid{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}

.mini{
  width:82px;
  min-height:90px;
}

.pointsBox{
  font-size:15px;
  font-weight:700;
}

.resultLine{
  font-size:16px;
  margin-top:6px;
}

.moveLog{
  margin-top:7px;
  padding:8px 10px;
  background:#f7f8f9;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:13px;
}

.moveLog div+div{
  margin-top:4px;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <div>
      <h1>Silke gegen Silas</h1>
      <div class="sub">
        Version 9g – Kartentexte
      </div>
    </div>

    <div class="scoreBoard">

      <span>
        Silke:
        <span id="youTotal">0</span>
      </span>

      <span>
        Silas:
        <span id="silasTotal">0</span>
      </span>

    </div>

    <div class="topActions">

      <button
        id="newBtn"
        class="btn redBtn"
        type="button">
        Neues Spiel
      </button>

      <button
        id="newRoundTopBtn"
        class="btn greenBtn"
        type="button">
        Neue Runde
      </button>

    </div>

  </div>


  <div id="status" class="status">
    Version 9g bereit.
  </div>


  <div class="silasBox">

    <div class="silasHead">

      <div>

        <strong>
          Silas
        </strong>

        <div class="sub">
          Verdeckte Hand:
          <span id="silasCount">0</span>
          Karten
        </div>

      </div>

      <div id="silasMove" class="sub">
        wartet
      </div>

    </div>


    <div id="silasCards" class="backRow"></div>


    <div style="margin-top:10px">
      <strong>
        Silas ausgespielt
      </strong>
    </div>

    <div id="silasPlayed" class="playedGrid"></div>


    <div style="margin-top:10px">
      <strong>
        Silas – letzter Zug
      </strong>
    </div>

    <div id="silasLog" class="moveLog"></div>

  </div>


  <div class="board">

    <button
      id="drawBtn"
      class="zone deck"
      type="button"
      disabled>

      <div class="wave">🌊</div>

      <strong>
        2 Karten ziehen
      </strong>

      <div class="sub">
        <span id="deckCount">0</span>
        übrig
      </div>

    </button>


    <button
      id="pileA"
      class="zone"
      type="button"
      disabled>

      <h2>Ablage A</h2>

      <div id="pileAcard">
        leer
      </div>

    </button>


    <button
      id="pileB"
      class="zone"
      type="button"
      disabled>

      <h2>Ablage B</h2>

      <div id="pileBcard">
        leer
      </div>

    </button>

  </div>


  <div
    id="choiceBox"
    class="choice hidden">

    <strong id="choiceTitle"></strong>

    <div
      id="choiceGrid"
      class="choiceGrid">
    </div>

  </div>


  <div class="hand">

    <div class="handHead">

      <div>

        <strong>
          Deine Hand
        </strong>

        <div class="pointsBox">
          Punkte:
          <span id="youPoints">0</span>
        </div>

      </div>


      <div class="endActions">

        <button
          id="endTurnBtn"
          class="btn greenBtn"
          type="button"
          disabled>
          Zug beenden
        </button>

        <button
          id="stopBtn"
          class="btn"
          type="button"
          disabled>
          Stopp
        </button>

        <button
          id="chanceBtn"
          class="btn chanceBtn"
          type="button"
          disabled>
          Letzte Chance
        </button>

      </div>

    </div>


    <div
      id="handGrid"
      class="handGrid">
    </div>


    <div
      id="duoActions"
      class="duoActions">
    </div>

  </div>


  <div class="playedBox">

    <strong>
      Deine ausgespielten Duos
    </strong>

    <div
      id="playedGrid"
      class="playedGrid">
    </div>

  </div>


  <div
    id="roundResult"
    class="resultBox hidden">

    <strong id="resultTitle">
      Rundenergebnis
    </strong>

    <div
      id="resultText"
      style="margin-top:8px">
    </div>


    <div style="margin-top:12px">
      <strong>
        Silas deckt auf
      </strong>
    </div>


    <div
      id="silasReveal"
      class="handGrid">
    </div>


    <button
      id="nextRoundBtn"
      class="btn greenBtn"
      type="button"
      style="margin-top:12px">
      Nächste Runde
    </button>

  </div>

</div>


<script>
(()=>{

'use strict';


const $=
  id=>document.getElementById(id);


/*
  Absichtlich weiterhin derselbe Speicherschlüssel
  wie in Version 9f, damit eine laufende Partie
  nach dem Update erhalten bleibt.
*/
const SAVE_KEY=
  'silke-vs-silas-v9f';


const names={
  crab:'Mr Krabs',
  boat:'Boot',
  fish:'Fisch',
  shark:'Hai',
  swimmer:'Schwimmer',
  shell:'Muschel',
  octopus:'Oktopus',
  penguin:'Pinguin',
  sailor:'Anker',
  mermaid:'Meerjungfrau',
  lighthouse:'eine pro Boot',
  shoal:'ein pro Fisch',
  colony:'zwei pro Pinguin',
  captain:'drei pro Anker'
};


const icons={
  crab:'🦀',
  boat:'⛵',
  fish:'🐟',
  shark:'🦈',
  swimmer:'🏊',
  shell:'🐚',
  octopus:'🐙',
  penguin:'🐧',
  sailor:'⚓',
  mermaid:'🧜‍♀️',
  lighthouse:'🗼',
  shoal:'🐟',
  colony:'🐧',
  captain:'🧭'
};


/*
  NEU in Version 9g:
  Die kurzen Wertungs- und Aktionshinweise,
  die direkt auf jeder Karte angezeigt werden.
*/
const cardRules={

  crab:
    '2 = 1 Pkt · Ablage durchsuchen',

  boat:
    '2 = 1 Pkt · Extra-Zug',

  fish:
    '2 = 1 Pkt · 1 Karte ziehen',

  shark:
    'Hai + Schwimmer = 1 Pkt · Karte stehlen',

  swimmer:
    'Hai + Schwimmer = 1 Pkt · Karte stehlen',

  shell:
    '2=2 · 3=4 · 4=6 · 5=8 · 6=10',

  octopus:
    '2=3 · 3=6 · 4=9 · 5=12',

  penguin:
    '1=1 · 2=3 · 3=5',

  sailor:
    '2 = 5 Punkte',

  lighthouse:
    '+1 je Boot',

  shoal:
    '+1 je Fisch',

  colony:
    '+2 je Pinguin',

  captain:
    '+3 je Anker',

  mermaid:
    'Wertet häufigste Farbe · 4 = Sofortsieg'
};


const colorNames={
  darkblue:'Dunkelblau',
  turquoise:'Türkis',
  yellow:'Gelb',
  black:'Schwarz',
  green:'Grün',
  gray:'Grau',
  lavender:'Lila',
  pink:'Rosa',
  peach:'Pfirsich',
  orange:'Orange',
  tan:'Beige',
  white:'Weiß'
};


const typeCounts={
  crab:9,
  boat:8,
  fish:7,
  shark:5,
  swimmer:5,
  shell:6,
  octopus:5,
  penguin:3,
  sailor:2,
  lighthouse:1,
  shoal:1,
  colony:1,
  captain:1,
  mermaid:4
};


const colorCounts={
  darkblue:9,
  turquoise:9,
  yellow:8,
  black:8,
  green:6,
  gray:4,
  lavender:4,
  pink:2,
  peach:2,
  orange:1,
  tan:1,
  white:4
};


let uid=1;


function shuffle(arr){

  const a=
    arr.slice();


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];
  }


  return a;
}


function makeDeck(){

  const types=[];
  const colors=[];


  Object.entries(
    typeCounts
  )
  .forEach(
    ([t,n])=>{

      if(
        t!=='mermaid'
      ){

        for(
          let i=0;
          i<n;
          i++
        ){

          types.push(t);
        }
      }
    }
  );


  Object.entries(
    colorCounts
  )
  .forEach(
    ([c,n])=>{

      if(
        c!=='white'
      ){

        for(
          let i=0;
          i<n;
          i++
        ){

          colors.push(c);
        }
      }
    }
  );


  const cs=
    shuffle(colors);


  const cards=
    types.map(
      (type,i)=>({
        id:uid++,
        type:type,
        color:cs[i]
      })
    );


  for(
    let i=0;
    i<4;
    i++
  ){

    cards.push({
      id:uid++,
      type:'mermaid',
      color:'white'
    });
  }


  return shuffle(cards);
}


const state={

  deck:[],

  piles:[
    [],
    []
  ],

  hand:[],

  silasHand:[],

  played:[],

  silasPlayed:[],

  youTotal:0,

  silasTotal:0,

  started:false,

  busy:false,

  roundOver:true,

  gameOver:false,

  turn:'none',

  phase:'draw',

  silasExtra:false,

  nextStarter:'you',

  currentStarter:'you',

  statusText:
    'Version 9g bereit.',

  silasLog:[],

  resultTitle:
    'Rundenergebnis',

  resultHTML:''
};


function saveGame(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify({
        uid:uid,
        state:state
      })
    );

  }
  catch(e){}
}


function loadGame(){

  try{

    const raw=
      localStorage.getItem(
        SAVE_KEY
      );


    if(!raw){

      return false;
    }


    const saved=
      JSON.parse(raw);


    if(
      !saved ||
      !saved.state
    ){

      return false;
    }


    Object.assign(
      state,
      saved.state
    );


    uid=
      saved.uid||
      uid;


    state.busy=
      false;


    if(
      !state.nextStarter
    ){

      state.nextStarter=
        'you';
    }


    if(
      !state.currentStarter
    ){

      state.currentStarter=
        'you';
    }


    if(
      !Array.isArray(
        state.silasLog
      )
    ){

      state.silasLog=[];
    }


    return true;

  }
  catch(e){

    return false;
  }
}


function countType(
  cards,
  type
){

  return cards.filter(
    c=>c.type===type
  ).length;
}


function scoreCards(
  hand,
  played
){

  const cards=
    hand.concat(
      played
    );


  let p=0;


  p+=
    Math.floor(
      countType(
        cards,
        'crab'
      )/2
    );


  p+=
    Math.floor(
      countType(
        cards,
        'boat'
      )/2
    );


  p+=
    Math.floor(
      countType(
        cards,
        'fish'
      )/2
    );


  p+=
    Math.min(

      countType(
        cards,
        'shark'
      ),

      countType(
        cards,
        'swimmer'
      )

    );


  const sh=[
    0,0,2,4,6,8,10
  ];


  const oc=[
    0,0,3,6,9,12
  ];


  const pe=[
    0,1,3,5
  ];


  const sa=[
    0,0,5
  ];


  p+=
    sh[
      Math.min(
        countType(
          cards,
          'shell'
        ),
        6
      )
    ]||0;


  p+=
    oc[
      Math.min(
        countType(
          cards,
          'octopus'
        ),
        5
      )
    ]||0;


  p+=
    pe[
      Math.min(
        countType(
          cards,
          'penguin'
        ),
        3
      )
    ]||0;


  p+=
    sa[
      Math.min(
        countType(
          cards,
          'sailor'
        ),
        2
      )
    ]||0;


  if(
    countType(
      cards,
      'lighthouse'
    )
  ){

    p+=
      countType(
        cards,
        'boat'
      );
  }


  if(
    countType(
      cards,
      'shoal'
    )
  ){

    p+=
      countType(
        cards,
        'fish'
      );
  }


  if(
    countType(
      cards,
      'colony'
    )
  ){

    p+=
      2*
      countType(
        cards,
        'penguin'
      );
  }


  if(
    countType(
      cards,
      'captain'
    )
  ){

    p+=
      3*
      countType(
        cards,
        'sailor'
      );
  }


  const m=
    countType(
      cards,
      'mermaid'
    );


  if(m){

    const f={};


    cards.forEach(
      c=>{

        f[c.color]=
          (
            f[c.color]||
            0
          )
          +1;
      }
    );


    const vals=
      Object.values(f)
        .sort(
          (a,b)=>
            b-a
        );


    for(
      let i=0;
      i<m;
      i++
    ){

      p+=
        vals[i]||
        0;
    }
  }


  return p;
}


function colorBonus(
  hand,
  played
){

  const f={};


  hand.concat(
    played
  )
  .forEach(
    c=>{

      f[c.color]=
        (
          f[c.color]||
          0
        )
        +1;
    }
  );


  const v=
    Object.values(f);


  return v.length
    ? Math.max(...v)
    : 0;
}


function score(){

  return scoreCards(
    state.hand,
    state.played
  );
}


function hasFourMermaids(
  hand,
  played
){

  return countType(
    hand.concat(
      played
    ),
    'mermaid'
  )>=4;
}


function setStatus(t){

  state.statusText=t;


  $('status')
    .textContent=t;
}


function clearSilasLog(){

  state.silasLog=[];


  renderSilasLog();
}


function addSilasLog(t){

  state.silasLog
    .push(t);


  renderSilasLog();
}


function renderSilasLog(){

  $('silasLog')
    .innerHTML=

    state.silasLog.length

    ? state.silasLog
        .map(
          t=>
            `<div>${t}</div>`
        )
        .join('')

    : '<div class="sub">Noch kein Zug.</div>';
}


function topCard(i){

  const p=
    state.piles[i];


  return p[
    p.length-1
  ]||null;
}


function cardHTML(
  c,
  mini=false
){

  const rule=
    cardRules[c.type]||
    '';


  return `
    <div class="card ${c.color}${mini?' mini':''}">

      <div>

        <div class="ico">
          ${icons[c.type]}
        </div>

        <div class="name">
          ${names[c.type]}
        </div>

        <div class="rule">
          ${rule}
        </div>

      </div>

      <div class="meta">
        ${colorNames[c.color]}
      </div>

    </div>
  `;
}


function renderSilas(){

  $('silasCount')
    .textContent=
    state.silasHand.length;


  $('silasCards')
    .innerHTML='';


  state.silasHand
    .forEach(
      ()=>{

        const d=
          document.createElement(
            'div'
          );


        d.className=
          'backCard';


        d.textContent=
          '✦';


        $('silasCards')
          .appendChild(d);
      }
    );


  $('silasPlayed')
    .innerHTML=

    state.silasPlayed.length

    ? state.silasPlayed
        .map(
          c=>
            cardHTML(
              c,
              true
            )
        )
        .join('')

    : '<span class="sub">Noch nichts ausgespielt.</span>';


  renderSilasLog();
}


function renderDuos(){

  const box=
    $('duoActions');


  box.innerHTML='';


  if(
    !state.started ||
    state.busy ||
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action'
  ){

    return;
  }


  const defs=[

    [
      'Mr-Krabs-Duo ausspielen',
      countType(
        state.hand,
        'crab'
      )>=2,
      ()=>playDuo(
        'crab',
        'crab'
      )
    ],

    [
      'Boot-Duo ausspielen',
      countType(
        state.hand,
        'boat'
      )>=2,
      ()=>playDuo(
        'boat',
        'boat'
      )
    ],

    [
      'Fisch-Duo ausspielen',
      countType(
        state.hand,
        'fish'
      )>=2,
      ()=>playDuo(
        'fish',
        'fish'
      )
    ],

    [
      'Hai + Schwimmer ausspielen',
      countType(
        state.hand,
        'shark'
      )>=1
      &&
      countType(
        state.hand,
        'swimmer'
      )>=1,
      ()=>playDuo(
        'shark',
        'swimmer'
      )
    ]

  ];


  defs.forEach(
    ([label,ok,fn])=>{

      if(ok){

        const b=
          document.createElement(
            'button'
          );


        b.type=

      );

    ? state.hand
        .map(
          c=>cardHTML(c)
        )
        .join('')

    : '<span class="sub">Noch keine Karten.</span>';


  $('playedGrid')
    .innerHTML=

    ? state.played
        .map(
          c=>
            cardHTML(
              c,
              true
            )
        )
        .join('')

    : '<span class="sub">Noch nichts ausgespielt.</span>';


  renderSilas();

  renderDuos();

  renderResult();


  const yourTurn=

    state.started

    &&

    !state.busy

    &&

    !state.roundOver

    &&

    !state.gameOver

    &&

    state.turn==='you';


  const canDraw=

    yourTurn

    &&

    state.phase==='draw';


  const canAct=

    yourTurn

    &&

    state.phase==='action';


  $('drawBtn')
    .disabled=

    !canDraw

    ||

    state.deck.length<2;


  $('pileA')
    .disabled=

    !canDraw

    ||

    !a;


  $('pileB')
    .disabled=

    !canDraw

    ||

    !b;


  $('endTurnBtn')
    .disabled=
    !canAct;


  const enough=
    score()>=7;


  $('stopBtn')
    .disabled=

    !canAct

    ||

    !enough;


  $('chanceBtn')
    .disabled=

    !canAct

    ||

    !enough;


  $('newRoundTopBtn')
    .disabled=

    !state.started

    ||

    state.gameOver;
}

function startRound(){

  if(
    state.gameOver
  ){

    setStatus(
      'Die Partie ist beendet. Bitte starte mit „Neues Spiel“ eine neue Partie.'
    );


    render();


    return;
  }


  const starter=
    state.nextStarter||
    'you';


  state.currentStarter=
    starter;


  state.nextStarter=
    starter==='you'
    ? 'silas'
    : 'you';


  state.deck=
    makeDeck();


  state.piles=[
    [],
    []
  ];


  state.hand=[];

  state.silasHand=[];

  state.played=[];

  state.silasPlayed=[];


  state.started=true;

  state.roundOver=false;

  state.phase='draw';

  state.silasExtra=false;

  state.resultTitle=
    'Rundenergebnis';

  state.resultHTML='';

  state.silasLog=[];


  state.piles[0]
    .push(
      state.deck.pop()
    );


  state.piles[1]
    .push(
      state.deck.pop()
    );


  if(
    starter==='you'
  ){

    state.turn=
      'you';


    state.busy=
      false;


    $('silasMove')
      .textContent=
      'wartet';


    setStatus(
      'Silke beginnt diese Runde. Ziehe zwei Karten oder nimm eine offene Karte.'
    );


    render();

    saveGame();
  }
  else{

    state.turn=
      'silas';


    state.busy=
      true;


    $('silasMove')
      .textContent=
      'beginnt die Runde …';


    setStatus(
      'Silas beginnt diese Runde.'
    );


    render();

    saveGame();


    setTimeout(
      silasTurn,
      700
    );
  }
}

){

  if(
    emptyA||
    emptyB
  ){

    const idx=
      emptyA
      ? 0
      : 1;

      .push(

    state.piles[idx]

    closeChoice();


    afterYouGain(

        : 'B'
      )
      +

    );

  }


  showChoice(
    names[discard.type]

    [

            );
          }
      },

              );

              .push(

              );

            afterYouGain(

function afterYouGain(message){

  if(
    hasFourMermaids(
      state.hand,
      state.played
    )
  ){

    instantWin(
      'you'
    );


    return;
  }


  enterActionPhase(

  );
}


function removePairFrom(
  hand,
  a,
  b
){

  const i1=
    hand.findIndex(
      c=>c.type===a
    );


  if(i1<0){

    return null;
  }


  const c1=
    hand.splice(
      i1,
      1
    )[0];


  const i2=
    hand.findIndex(
      c=>c.type===b
    );


  if(i2<0){

    hand.push(c1);

    return null;
  }


  return [

    c1,

    hand.splice(
      i2,
      1
    )[0]

  ];
}


function playDuo(
  a,
  b
){

  if(
    state.busy ||
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action'
  ){

    return;
  }


  const pair=
    removePairFrom(
      state.hand,
      a,
      b
    );


  if(!pair){

    return;
  }


  state.played
    .push(
      ...pair
    );


  if(
    a==='boat'
  ){

    state.phase=
      'draw';


    setStatus(
      'Boot-Duo: Extra-Zug! Ziehe wieder zwei Karten oder nimm eine offene Karte.'
    );


    render();

    saveGame();

    return;
  }


  if(
    a==='fish'
  ){

    if(
      state.deck.length
    ){

      const c=
        state.deck.pop();


      state.hand
        .push(c);


      if(
        hasFourMermaids(
          state.hand,
          state.played
        )
      ){

        instantWin(
          'you'
        );


        return;
      }


      setStatus(
        'Fisch-Duo: Du ziehst '
        +
        names[c.type]
        +
        ' vom Nachziehstapel. Du darfst weitere Duos spielen oder den Zug beenden.'
      );
    }
    else{

      setStatus(
        'Fisch-Duo: Der Nachziehstapel ist leer. Du darfst weitere Duos spielen oder den Zug beenden.'
      );
    }


    render();

    saveGame();

    return;
  }


  if(
    a==='shark'
    &&
    b==='swimmer'
  ){

    if(
      state.silasHand.length
    ){

      const i=
        Math.floor(
          Math.random()*
          state.silasHand.length
        );


      const c=
        state.silasHand
          .splice(
            i,
            1
          )[0];


      state.hand
        .push(c);


      if(
        hasFourMermaids(
          state.hand,
          state.played
        )
      ){

        instantWin(
          'you'
        );


        return;
      }


      setStatus(
        'Hai + Schwimmer: Du stiehlst '
        +
        names[c.type]
        +
        ' von Silas. Du darfst weitere Duos spielen oder den Zug beenden.'
      );
    }
    else{

      setStatus(
        'Hai + Schwimmer: Silas hat keine Karte zum Stehlen. Du darfst weitere Duos spielen oder den Zug beenden.'
      );
    }


    render();

    saveGame();

    return;
  }


  if(
    a==='crab'
  ){

    chooseCrabPile();
  }
}

function silasCardValue(c){

  let v=0;


  if(
    c.type==='mermaid'
  ){

    v+=7;
  }


  if(
    [
      'penguin',
      'octopus',
      'shell',
      'sailor'
    ].includes(
      c.type
    )
  ){

    v+=4;
  }


  if(
    [
      'lighthouse',
      'shoal',
      'colony',
      'captain'
    ].includes(
      c.type
    )
  ){

    v+=3;
  }


  if(
    [
      'crab',
      'boat',
      'fish'
    ].includes(
      c.type
    )
  ){

    v+=
      countType(
        state.silasHand,
        c.type
      )>0
      ? 5
      : 1;
  }


  if(
    c.type==='shark'
    &&
    countType(
      state.silasHand,
      'swimmer'
    )>0
  ){

    v+=5;
  }


  if(
    c.type==='swimmer'
    &&
    countType(
      state.silasHand,
      'shark'
    )>0
  ){

    v+=5;
  }


  return v;
}


function silasTakeOneCard(){

  const a=
    topCard(0);


  const b=
    topCard(1);


  const va=
    a
    ? silasCardValue(a)
    : -1;


  const vb=
    b
    ? silasCardValue(b)
    : -1;


  if(
    Math.max(
      va,
      vb
    )>=4
  ){

    const i=
      va>=vb
      ? 0
      : 1;


    const chosen=
      state.piles[i]
        .pop();


    state.silasHand
      .push(
        chosen
      );


    $('silasMove')
      .textContent=
      'nahm eine offene Karte';


    addSilasLog(
      'Silas nimmt '
      +
      names[chosen.type]
      +
      ' von Ablage '
      +
      (
        i===0
        ? 'A'
        : 'B'
      )
      +
      '.'
    );


    return;
  }


  if(
    state.deck.length>=2
  ){

    const x=
      state.deck.pop();


    const y=
      state.deck.pop();


    const keep=
      silasCardValue(x)
      >=
      silasCardValue(y)
      ? x
      : y;


    const disc=
      keep===x
      ? y
      : x;


    state.silasHand
      .push(
        keep
      );


    const emptyA=
      state.piles[0].length===0;


    const emptyB=
      state.piles[1].length===0;


    const pileIndex=

      (
        emptyA||
        emptyB
      )

      ? (
          emptyA
          ? 0
          : 1
        )

      : (
          Math.random()<.5
          ? 0
          : 1
        );


    state.piles[
      pileIndex
    ]
    .push(
      disc
    );


    $('silasMove')
      .textContent=
      'zog zwei Karten';


    addSilasLog(
      'Silas zieht 2 Karten vom Nachziehstapel und legt '
      +
      names[disc.type]
      +
      ' auf Ablage '
      +
      (
        pileIndex===0
        ? 'A'
        : 'B'
      )
      +
      (
        emptyA||
        emptyB
        ? ' (leerer Stapel).'
        : '.'
      )
    );


    return;
  }


  let i=-1;


  if(
    a&&b
  ){

    i=
      va>=vb
      ? 0
      : 1;
  }
  else if(a){

    i=0;
  }
  else if(b){

    i=1;
  }


  if(
    i>=0
  ){

    const chosen=
      state.piles[i]
        .pop();


    state.silasHand
      .push(
        chosen
      );


    $('silasMove')
      .textContent=
      'nahm eine offene Karte';


    addSilasLog(
      'Silas nimmt '
      +
      names[chosen.type]
      +
      ' von Ablage '
      +
      (
        i===0
        ? 'A'
        : 'B'
      )
      +
      '.'
    );
  }
}


function silasPlayDuos(
  allowBoatExtra=true
){

  let changed=true;


  while(changed){

    changed=false;


    if(
      countType(
        state.silasHand,
        'boat'
      )>=2
    ){

      const p=
        removePairFrom(
          state.silasHand,
          'boat',
          'boat'
        );


      if(p){

        state.silasPlayed
          .push(
            ...p
          );


        if(
          allowBoatExtra
        ){

          state.silasExtra=true;
        }


        $('silasMove')
          .textContent=
          'spielte ein Boot-Duo';


        addSilasLog(
          'Silas spielt ein Boot-Duo und bekommt einen Extra-Zug.'
        );


        changed=true;

        continue;
      }
    }


    if(
      countType(
        state.silasHand,
        'fish'
      )>=2
    ){

      const p=
        removePairFrom(
          state.silasHand,
          'fish',
          'fish'
        );


      if(p){

        state.silasPlayed
          .push(
            ...p
          );


        if(
          state.deck.length
        ){

          state.silasHand
            .push(
              state.deck.pop()
            );


          addSilasLog(
            'Silas spielt ein Fisch-Duo und zieht 1 zusätzliche Karte vom Nachziehstapel.'
          );
        }
        else{

          addSilasLog(
            'Silas spielt ein Fisch-Duo. Der Nachziehstapel ist leer.'
          );
        }


        $('silasMove')
          .textContent=
          'spielte ein Fisch-Duo';


        changed=true;

        continue;
      }
    }


    if(
      countType(
        state.silasHand,
        'shark'
      )
      &&
      countType(
        state.silasHand,
        'swimmer'
      )
    ){

      const p=
        removePairFrom(
          state.silasHand,
          'shark',
          'swimmer'
        );


      if(p){

        state.silasPlayed
          .push(
            ...p
          );


        if(
          state.hand.length
        ){

          const i=
            Math.floor(
              Math.random()*
              state.hand.length
            );


          const stolen=
            state.hand
              .splice(
                i,
                1
              )[0];


          state.silasHand
            .push(
              stolen
            );


          addSilasLog(
            'Silas spielt Hai + Schwimmer und stiehlt '
            +
            names[stolen.type]
            +
            ' aus deiner Hand.'
          );
        }
        else{

          addSilasLog(
            'Silas spielt Hai + Schwimmer, aber du hast keine Karte zum Stehlen.'
          );
        }


        $('silasMove')
          .textContent=
          'spielte Hai + Schwimmer';


        changed=true;

        continue;
      }
    }


    if(
      countType(
        state.silasHand,
        'crab'
      )>=2
    ){

      const p=
        removePairFrom(
          state.silasHand,
          'crab',
          'crab'
        );


      if(p){

        state.silasPlayed
          .push(
            ...p
          );


        const possible=[];


        if(
          state.piles[0]
            .length
        ){

          possible.push(0);
        }


        if(
          state.piles[1]
            .length
        ){

          possible.push(1);
        }


        if(
          possible.length
        ){

          const pi=
            possible[
              Math.floor(
                Math.random()*
                possible.length
              )
            ];


          let best=0;
          let bv=-999;


          state.piles[
            pi
          ]
          .forEach(
            (c,i)=>{

              const v=
                silasCardValue(c);


              if(
                v>bv
              ){

                bv=v;

                best=i;
              }
            }
          );


          const chosen=
            state.piles[
              pi
            ]
            .splice(
              best,
              1
            )[0];


          state.silasHand
            .push(
              chosen
            );


          addSilasLog(
            'Silas spielt ein Mr-Krabs-Duo, durchsucht Ablage '
            +
            (
              pi===0
              ? 'A'
              : 'B'
            )
            +
            ' und nimmt '
            +
            names[chosen.type]
            +
            '.'
          );
        }
        else{

          addSilasLog(
            'Silas spielt ein Mr-Krabs-Duo, aber beide Ablagestapel sind leer.'
          );
        }


        $('silasMove')
          .textContent=
          'spielte ein Mr-Krabs-Duo';


        changed=true;

        continue;
      }
    }
  }
}


function silasTurn(){

  if(
    !state.started ||
    state.roundOver ||
    state.gameOver
  ){

    return;
  }


  silasTakeOneCard();


  silasPlayDuos(
    true
  );


  if(
    hasFourMermaids(
      state.silasHand,
      state.silasPlayed
    )
  ){

    instantWin(
      'silas'
    );


    return;
  }


  render();


  if(
    state.silasExtra
  ){

    state.silasExtra=false;


    setStatus(
      'Silas hat ein Boot-Duo gespielt und bekommt einen Extra-Zug.'
    );


    setTimeout(
      silasTurn,
      700
    );


    return;
  }


  const sp=
    scoreCards(
      state.silasHand,
      state.silasPlayed
    );


  if(
    sp>=12
  ){

    addSilasLog(
      'Silas beendet die Runde mit Stopp.'
    );


    finishRound(
      'stop',
      'silas'
    );


    return;
  }


  state.busy=false;


  state.turn=
    'you';


  state.phase=
    'draw';


  setStatus(
    'Silas ist fertig. Du bist dran: Ziehe zwei Karten oder nimm eine offene Karte.'
  );


  render();

  saveGame();
}


function finishRound(
  mode,
  caller
){

  if(
    state.roundOver
  ){

    return;
  }


  state.roundOver=true;

  state.busy=true;


  const yp=
    scoreCards(
      state.hand,
      state.played
    );


  const sp=
    scoreCards(
      state.silasHand,
      state.silasPlayed
    );


  const yb=
    colorBonus(
      state.hand,
      state.played
    );


  const sb=
    colorBonus(
      state.silasHand,
      state.silasPlayed
    );


  let ya=0;

  let sa=0;

  let explain='';


  if(
    mode==='stop'
  ){

    ya=yp;

    sa=sp;


    explain=
      (
        caller==='you'
        ? 'Du'
        : 'Silas'
      )
      +
      ' hat Stopp gesagt. Beide erhalten ihre Kartenpunkte.';
  }
  else if(
    caller==='you'
  ){

    if(
      yp>=sp
    ){

      ya=
        yp+yb;


      sa=
        sb;


      explain=
        'Letzte Chance gewonnen: Du erhältst Kartenpunkte plus Farbbonus. Silas erhält nur seinen Farbbonus.';
    }
    else{

      ya=
        yb;


      sa=
        sp;


      explain=
        'Letzte Chance verloren: Du erhältst nur deinen Farbbonus. Silas erhält seine Kartenpunkte.';
    }
  }
  else{

    if(
      sp>=yp
    ){

      sa=
        sp+sb;


      ya=
        yb;


      explain=
        'Silas gewinnt seine Letzte Chance. Silas erhält Kartenpunkte plus Farbbonus, du nur deinen Farbbonus.';
    }
    else{

      sa=
        sb;


      ya=
        yp;


      explain=
        'Silas verliert seine Letzte Chance. Silas erhält nur seinen Farbbonus, du deine Kartenpunkte.';
    }
  }


  state.youTotal+=
    ya;


  state.silasTotal+=
    sa;


  state.resultTitle=
    'Rundenergebnis';


  state.resultHTML=

    `<div class="resultLine">
      <strong>
        Du: ${yp} Kartenpunkte${mode==='last'?` · Farbbonus ${yb}`:''}
      </strong>
    </div>`

    +

    `<div class="resultLine">
      <strong>
        Silas: ${sp} Kartenpunkte${mode==='last'?` · Farbbonus ${sb}`:''}
      </strong>
    </div>`

    +

    `<div class="resultLine">
      <strong>
        Für diese Runde:
        Silke +${ya} ·
        Silas +${sa}
      </strong>
    </div>`

    +

    `<div class="resultLine sub">
      ${explain}
    </div>`;


  if(
    state.youTotal>=40
    ||
    state.silasTotal>=40
  ){

    state.gameOver=true;


    state.turn=
      'none';


    state.phase=
      'done';


    if(
      state.youTotal>
      state.silasTotal
    ){

      state.resultTitle=
        '🎉 Silke gewinnt die Partie!';


      setStatus(
        'Partie beendet – du gewinnst mit '
        +
        state.youTotal
        +
        ' zu '
        +
        state.silasTotal
        +
        '. Für eine weitere Partie bitte „Neues Spiel“ drücken.'
      );
    }
    else if(
      state.silasTotal>
      state.youTotal
    ){

      state.resultTitle=
        'Silas gewinnt die Partie.';


      setStatus(
        'Partie beendet – Silas gewinnt mit '
        +
        state.silasTotal
        +
        ' zu '
        +
        state.youTotal
        +
        '. Für eine weitere Partie bitte „Neues Spiel“ drücken.'
      );
    }
    else{

      state.resultTitle=
        'Unentschieden.';


      setStatus(
        'Partie beendet – Gleichstand '
        +
        state.youTotal
        +
        ' zu '
        +
        state.silasTotal
        +
        '. Für eine weitere Partie bitte „Neues Spiel“ drücken.'
      );
    }
  }
  else{

    const nextName=
      state.nextStarter==='you'
      ? 'Silke'
      : 'Silas';


    setStatus(
      'Runde beendet. Gesamtstand: Silke '
      +
      state.youTotal
      +
      ' : '
      +
      state.silasTotal
      +
      ' Silas. Die nächste Runde beginnt '
      +
      nextName
      +
      '.'
    );
  }


  render();

  saveGame();
}


function stopRound(){

  if(
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action' ||
    score()<7
  ){

    return;
  }


  finishRound(
    'stop',
    'you'
  );
}


function lastChance(){

  if(
    state.roundOver ||
    state.gameOver ||
    state.turn!=='you' ||
    state.phase!=='action' ||
    score()<7
  ){

    return;
  }


  state.busy=true;

  state.turn=
    'silas';


  $('silasMove')
    .textContent=
    'hat seinen letzten Zug …';


  clearSilasLog();


  setStatus(
    'Letzte Chance! Deine Hand ist fest. Silas bekommt genau einen letzten Zug.'
  );


  render();


  setTimeout(
    ()=>{

      silasTakeOneCard();


      silasPlayDuos(
        false
      );


      state.silasExtra=false;


      if(
        hasFourMermaids(
          state.silasHand,
          state.silasPlayed
        )
      ){

        instantWin(
          'silas'
        );


        return;
      }


      finishRound(
        'last',
        'you'
      );

    },
    700
  );
}


function instantWin(player){

  state.roundOver=true;

  state.gameOver=true;

  state.busy=true;

  state.turn='none';

  state.phase='done';


  if(
    player==='you'
  ){

    state.resultTitle=
      '🧜‍♀️🧜‍♀️🧜‍♀️🧜‍♀️ Sofortsieg!';


    state.resultHTML=
      '<div class="resultLine"><strong>Du hast alle vier Meerjungfrauen und gewinnst die gesamte Partie sofort.</strong></div>';


    setStatus(
      'Vier Meerjungfrauen – du gewinnst die Partie sofort! Für eine weitere Partie bitte „Neues Spiel“ drücken.'
    );
  }
  else{

    state.resultTitle=
      'Silas gewinnt mit vier Meerjungfrauen.';


    state.resultHTML=
      '<div class="resultLine"><strong>Silas hat alle vier Meerjungfrauen und gewinnt die gesamte Partie sofort.</strong></div>';


    setStatus(
      'Silas gewinnt die Partie sofort durch vier Meerjungfrauen. Für eine weitere Partie bitte „Neues Spiel“ drücken.'
    );
  }


  render();

  saveGame();
}


$('newBtn')
  .addEventListener(
    'click',
    newGame
  );


$('newRoundTopBtn')
  .addEventListener(
    'click',
    startRound
  );


$('drawBtn')
  .addEventListener(
    'click',
    drawTwo
  );


$('pileA')
  .addEventListener(
    'click',
    ()=>takePile(
      0
    )
  );


$('pileB')
  .addEventListener(
    'click',
    ()=>takePile(
      1
    )
  );


$('endTurnBtn')
  .addEventListener(
    'click',
    endYourTurn
  );


$('stopBtn')
  .addEventListener(
    'click',
    stopRound
  );


$('chanceBtn')
  .addEventListener(
    'click',
    lastChance
  );


$('nextRoundBtn')
  .addEventListener(
    'click',
    startRound
  );


loadGame();

render();

})();
</script>
