<html lang="de">
<head>

:root{
  --bg:#f6f3ec;
  --ink:#17202a;
  --muted:#6c7680;
  --line:#d7d1c6;
  --accent:#2b7a78;
  --accent2:#fff4df;
  --danger:#a23b3b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

.app{
  max-width:780px;
  margin:auto;
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

h1{
  font-size:28px;
  margin:0;
}

.sub{color:var(--muted)}

.scoreBoard{
  display:flex;
  gap:15px;
  font-size:18px;
  font-weight:bold;
}

button{font:inherit}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:13px 17px;
  font-weight:700;
  min-height:48px;
}

.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.duoBtn{
  background:var(--accent2);
  border-color:#e3bd7f;
}

.stopBtn{
  background:#fff;
}

.chanceBtn{
  background:#fff3e2;
  border-color:#e0ae66;
}

.btn:disabled{
  opacity:.4;
}

.status{
  margin:16px 0;
  padding:14px;
  border:1px solid #c7dfdc;
  background:#edf7f6;
  border-radius:14px;
  font-weight:700;
}

.silasBox,
.hand,
.playedBox,
.resultBox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-top:14px;
}

.silasHead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.backRow{
  display:flex;
  gap:5px;
  margin-top:10px;
  flex-wrap:wrap;
}

.backCard{
  width:34px;
  height:48px;
  border-radius:7px;
  background:#28506b;
  border:2px solid white;
  box-shadow:0 0 0 1px #28506b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}
