<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silke gegen Silas – Version 8a</title>

<style>
:root{
  --bg:#f6f3ec;
  --ink:#17202a;
  --muted:#6c7680;
  --line:#d7d1c6;
  --accent:#2b7a78;
  --accent2:#fff4df;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

h1{
  font-size:28px;
  margin:0;
}

.sub{color:var(--muted)}

button{font:inherit}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:14px 18px;
  font-weight:700;
  min-height:48px;
}

.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.duoBtn{
  background:var(--accent2);
  border-color:#e3bd7f;
}

.btn:disabled{
  opacity:.4;
}

.status{
  margin:16px 0;
  padding:14px;
  border:1px solid #c7dfdc;
  background:#edf7f6;
  border-radius:14px;
  font-weight:700;
}

.silasBox,
.hand,
.playedBox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-top:14px;
}

.silasHead,
.handHead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

.backRow{
  display:flex;
  gap:5px;
  margin-top:10px;
  flex-wrap:wrap;
}

.backCard{
  width:34px;
  height:48px;
  border-radius:7px;
  background:#28506b;
  border:2px solid white;
  box-shadow:0 0 0 1px #28506b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.board{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-top:14px;
}

.zone{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  min-height:170px;
}

.zone h2{
  font-size:15px;
  margin:0 0 10px;
  color:var(--muted);
}

.deck{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.wave{font-size:44px}

.card{
  border:1px solid rgba(0,0,0,.15);
  border-radius:14px;
  padding:12px;
  min-height:120px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.ico{font-size:34px}

.name{font-weight:800}

.meta{
  font-size:12px;
  color:#4e5963;
}

.darkblue{background:#cfe1f8}
.turquoise{background:#cff0ef}
.yellow{background:#faee9a}
.black{background:#dedfe2}
.green{background:#d9edcf}
.gray{background:#ececee}
.lavender{background:#e6d8f2}
.pink{background:#f4cedf}
.peach{background:#f4d3ba}
.orange{background:#f1b978}
.tan{background:#e8d8c1}
.white{background:#fff}

.choice{
  margin-top:16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.hidden{
  display:none;
}

.choiceGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.handGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:10px;
}

.playedGrid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.mini{
  width:95px;
  min-height:95px;
}

.duoActions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.pointsBox{
  font-size:17px;
  font-weight:700;
}

@media(max-width:620px){
  .board{
    grid-template-columns:1fr;
  }

  .handGrid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div>
      <h1>Silke gegen Silas</h1>
      <div class="sub">Version 8a – Punkte + Stopp</div>
    </div>

    <button id="newBtn" class="btn primary" type="button">
      Neue Partie
    </button>
  </div>

  <div id="status" class="status">
    Version 8a aktiv. Tippe auf „Neue Partie“.
  </div>

  <div class="silasBox">
    <div class="silasHead">

      <div>
        <strong>Silas</strong>

        <div class="sub">
          Verdeckte Hand:
          <span id="silasCount">0</span> Karten
        </div>
      </div>

      <div id="silasMove" class="sub">
        wartet
      </div>

    </div>

    <div id="silasCards" class="backRow"></div>
  </div>

  <div class="board">

    <button id="drawBtn" class="zone deck" type="button" disabled>
      <div class="wave">🌊</div>

      <strong>2 Karten ziehen</strong>

      <div class="sub">
        <span id="deckCount">0</span> Karten übrig
      </div>
    </button>

    <button id="pileA" class="zone" type="button" disabled>
      <h2>Ablage A</h2>
      <div id="pileAcard">leer</div>
    </button>

    <button id="pileB" class="zone" type="button" disabled>
      <h2>Ablage B</h2>
      <div id="pileBcard">leer</div>
    </button>

  </div>

  <div id="choiceBox" class="choice hidden">

    <strong id="choiceTitle"></strong>

    <div id="choiceGrid" class="choiceGrid"></div>

  </div>

  <div class="hand">

    <div class="handHead">

      <div>
        <strong>Deine Hand</strong>

        <div class="pointsBox">
          Punkte:
          <span id="youPoints">0</span>
        </div>
      </div>

      <button id="stopBtn" class="btn" type="button" disabled>
        Stopp
      </button>

    </div>

    <div id="handGrid" class="handGrid"></div>

    <div id="duoActions" class="duoActions"></div>

  </div>

  <div class="playedBox">

    <strong>Ausgespielte Duos</strong>

    <div id="playedGrid" class="playedGrid"></div>

  </div>

</div>

<script>
(() => {

'use strict';

const $ = id => document.getElementById(id);

const names = {
  crab:'Mr Krabs',
  boat:'Boot',
  fish:'Fisch',
  shark:'Hai',
  swimmer:'Schwimmer',
  shell:'Muschel',
  octopus:'Oktopus',
  penguin:'Pinguin',
  sailor:'Seemann',
  mermaid:'Meerjungfrau',
  lighthouse:'eine pro Boot',
  shoal:'ein pro Fisch',
  colony:'zwei pro Pinguin',
  captain:'Kapitän'
};

const icons = {
  crab:'🦀',
  boat:'⛵',
  fish:'🐟',
  shark:'🦈',
  swimmer:'🏊',
  shell:'🐚',
  octopus:'🐙',
  penguin:'🐧',
  sailor:'⚓',
  mermaid:'🧜‍♀️',
  lighthouse:'🗼',
  shoal:'🐟',
  colony:'🐧',
  captain:'🧭'
};

const colorNames = {
  darkblue:'Dunkelblau',
  turquoise:'Türkis',
  yellow:'Gelb',
  black:'Schwarz',
  green:'Grün',
  gray:'Grau',
  lavender:'Lila',
  pink:'Rosa',
  peach:'Pfirsich',
  orange:'Orange',
  tan:'Beige',
  white:'Weiß'
};

const typeCounts = {
  crab:9,
  boat:8,
  fish:7,
  shark:5,
  swimmer:5,
  shell:6,
  octopus:5,
  penguin:3,
  sailor:2,
  lighthouse:1,
  shoal:1,
  colony:1,
  captain:1,
  mermaid:4
};

const colorCounts = {
  darkblue:9,
  turquoise:9,
  yellow:8,
  black:8,
  green:6,
  gray:4,
  lavender:4,
  pink:2,
  peach:2,
  orange:1,
  tan:1,
  white:4
};

let uid = 1;

function shuffle(arr){

  const a = arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]] =
      [a[j],a[i]];
  }

  return a;
}

function makeDeck(){

  const types = [];

  Object.entries(typeCounts)
    .forEach(([type,n])=>{

      if(type !== 'mermaid'){

        for(let i=0;i<n;i++){
          types.push(type);
        }
      }
    });

  const colors = [];

  Object.entries(colorCounts)
    .forEach(([color,n])=>{

      if(color !== 'white'){

        for(let i=0;i<n;i++){
          colors.push(color);
        }
      }
    });

  const shuffledColors =
    shuffle(colors);

  const cards =
    types.map((type,i)=>({
      id:uid++,
      type:type,
      color:shuffledColors[i]
    }));

  for(let i=0;i<4;i++){

    cards.push({
      id:uid++,
      type:'mermaid',
      color:'white'
    });
  }

  return shuffle(cards);
}

const state = {

  deck:[],

  piles:[
    [],
    []
  ],

  hand:[],

  silasHand:[],

  played:[],

  started:false,

  busy:false,

  roundOver:true,

  turn:'none',

  extraTurn:false
};

function allCards(){

  return state.hand.concat(
    state.played
  );
}

function countType(cards,type){

  return cards.filter(
    card=>card.type===type
  ).length;
}

function score(){

  const cards =
    allCards();

  let points = 0;

  points +=
    Math.floor(
      countType(cards,'crab') / 2
    );

  points +=
    Math.floor(
      countType(cards,'boat') / 2
    );

  points +=
    Math.floor(
      countType(cards,'fish') / 2
    );

  points +=
    Math.min(
      countType(cards,'shark'),
      countType(cards,'swimmer')
    );

  const shellPoints =
    [0,0,2,4,6,8,10];

  points +=
    shellPoints[
      Math.min(
        countType(cards,'shell'),
        6
      )
    ] || 0;

  const octopusPoints =
    [0,0,3,6,9,12];

  points +=
    octopusPoints[
      Math.min(
        countType(cards,'octopus'),
        5
      )
    ] || 0;

  const penguinPoints =
    [0,1,3,5];

  points +=
    penguinPoints[
      Math.min(
        countType(cards,'penguin'),
        3
      )
    ] || 0;

  const sailorPoints =
    [0,0,5];

  points +=
    sailorPoints[
      Math.min(
        countType(cards,'sailor'),
        2
      )
    ] || 0;

  if(
    countType(
      cards,
      'lighthouse'
    ) > 0
  ){

    points +=
      countType(
        cards,
        'boat'
      );
  }

  if(
    countType(
      cards,
      'shoal'
    ) > 0
  ){

    points +=
      countType(
        cards,
        'fish'
      );
  }

  if(
    countType(
      cards,
      'colony'
    ) > 0
  ){

    points +=
      2 *
      countType(
        cards,
        'penguin'
      );
  }

  if(
    countType(
      cards,
      'captain'
    ) > 0
  ){

    points +=
      3 *
      countType(
        cards,
        'sailor'
      );
  }

  const mermaids =
    countType(
      cards,
      'mermaid'
    );

  if(mermaids>0){

    const colors = {};

    cards.forEach(card=>{

      colors[card.color] =
        (colors[card.color] || 0)
        + 1;
    });

    const frequencies =
      Object.values(colors)
        .sort(
          (a,b)=>b-a
        );

    for(
      let i=0;
      i<mermaids;
      i++
    ){

      points +=
        frequencies[i] || 0;
    }
  }

  return points;
}

function setStatus(text){

  $('status').textContent =
    text;
}

function topCard(index){

  const pile =
    state.piles[index];

  return (
    pile[pile.length-1] ||
    null
  );
}

function cardHTML(card,mini=false){

  return `
    <div class="card ${card.color}${mini?' mini':''}">

      <div>

        <div class="ico">
          ${icons[card.type]}
        </div>

        <div class="name">
          ${names[card.type]}
        </div>

      </div>

      <div class="meta">
        ${colorNames[card.color]}
      </div>

    </div>
  `;
}

function renderSilas(){

  $('silasCount').textContent =
    state.silasHand.length;

  $('silasCards').innerHTML =
    '';

  state.silasHand.forEach(()=>{

    const back =
      document.createElement(
        'div'
      );

    back.className =
      'backCard';

    back.textContent =
      '✦';

    $('silasCards')
      .appendChild(back);
  });
}

function renderDuos(){

  const box =
    $('duoActions');

  box.innerHTML =
    '';

  if(
    !state.started ||
    state.busy ||
    state.roundOver ||
    state.turn !== 'you'
  ){
    return;
  }

  const duos = [

    {
      label:
        'Mr-Krabs-Duo ausspielen',

      possible:
        countType(
          state.hand,
          'crab'
        ) >= 2,

      action:
        ()=>playDuo(
          'crab',
          'crab'
        )
    },

    {
      label:
        'Boot-Duo ausspielen',

      possible:
        countType(
          state.hand,
          'boat'
        ) >= 2,

      action:
        ()=>playDuo(
          'boat',
          'boat'
        )
    },

    {
      label:
        'Fisch-Duo ausspielen',

      possible:
        countType(
          state.hand,
          'fish'
        ) >= 2,

      action:
        ()=>playDuo(
          'fish',
          'fish'
        )
    },

    {
      label:
        'Hai + Schwimmer ausspielen',

      possible:
        countType(
          state.hand,
          'shark'
        ) >= 1
        &&
        countType(
          state.hand,
          'swimmer'
        ) >= 1,

      action:
        ()=>playDuo(
          'shark',
          'swimmer'
        )
    }
  ];

  duos.forEach(duo=>{

    if(duo.possible){

      const button =
        document.createElement(
          'button'
        );

      button.type =
        'button';

      button.className =
        'btn duoBtn';

      button.textContent =
        duo.label;

      button.addEventListener(
        'click',
        duo.action
      );

      box.appendChild(
        button
      );
    }
  });
}

function render(){

  $('deckCount').textContent =
    state.deck.length;

  $('youPoints').textContent =
    score();

  const cardA =
    topCard(0);

  const cardB =
    topCard(1);

  $('pileAcard').innerHTML =
    cardA
      ? cardHTML(cardA)
      : 'leer';

  $('pileBcard').innerHTML =
    cardB
      ? cardHTML(cardB)
      : 'leer';

  $('handGrid').innerHTML =
    state.hand.length
      ? state.hand
          .map(
            card=>
              cardHTML(card)
          )
          .join('')
      : '<span class="sub">Noch keine Karten.</span>';

  $('playedGrid').innerHTML =
    state.played.length
      ? state.played
          .map(
            card=>
              cardHTML(
                card,
                true
              )
          )
          .join('')
      : '<span class="sub">Noch nichts ausgespielt.</span>';

  renderSilas();

  renderDuos();

  const active =
    state.started &&
    !state.busy &&
    !state.roundOver &&
    state.turn === 'you';

  $('drawBtn').disabled =
    !active ||
    state.deck.length < 2;

  $('pileA').disabled =
    !active ||
    !cardA;

  $('pileB').disabled =
    !active ||
    !cardB;

  $('stopBtn').disabled =
    !active ||
    score() < 7;
}

function closeChoice(){

  state.busy =
    false;

  $('choiceBox')
    .classList
    .add('hidden');

  $('choiceGrid')
    .innerHTML =
    '';

  render();
}

function showChoice(
  title,
  options
){

  state.busy =
    true;

  $('choiceTitle')
    .textContent =
    title;

  $('choiceGrid')
    .innerHTML =
    '';

  $('choiceBox')
    .classList
    .remove('hidden');

  options.forEach(
    option=>{

      const button =
        document.createElement(
          'button'
        );

      button.type =
        'button';

      button.className =
        'btn';

      button.innerHTML =
        option.html ||
        option.label;

      button.addEventListener(
        'click',
        option.onClick
      );

      $('choiceGrid')
        .appendChild(button);
    }
  );

  render();
}

function newGame(){

  state.deck =
    makeDeck();

  state.piles =
    [
      [],
      []
    ];

  state.hand =
    [];

  state.silasHand =
    [];

  state.played =
    [];

  state.started =
    true;

  state.busy =
    false;

  state.roundOver =
    false;

  state.turn =
    'you';

  state.extraTurn =
    false;

  state.piles[0]
    .push(
      state.deck.pop()
    );

  state.piles[1]
    .push(
      state.deck.pop()
    );

  $('silasMove')
    .textContent =
    'wartet';

  setStatus(
    'Neue Partie gestartet. Du bist dran.'
  );

  render();
}

function drawTwo(){

  if(
    state.deck.length < 2 ||
    state.busy ||
    state.roundOver ||
    state.turn !== 'you'
  ){
    return;
  }

  const first =
    state.deck.pop();

  const second =
    state.deck.pop();

  showChoice(
    'Welche Karte möchtest du behalten?',
    [

      {
        html:
          cardHTML(first),

        onClick:
          ()=>chooseDiscard(
            first,
            second
          )
      },

      {
        html:
          cardHTML(second),

        onClick:
          ()=>chooseDiscard(
            second,
            first
          )
      }

    ]
  );
}

function chooseDiscard(
  keep,
  discard
){

  showChoice(
    names[discard.type] +
    ' ablegen auf …',
    [

      {
        label:
          'Ablage A',

        onClick:()=>{

          state.hand.push(
            keep
          );

          state.piles[0]
            .push(
              discard
            );

          closeChoice();

          setStatus(
            'Du behältst ' +
            names[keep.type] +
            '.'
          );

          finishYourTurn();
        }
      },

      {
        label:
          'Ablage B',

        onClick:()=>{

          state.hand.push(
            keep
          );

          state.piles[1]
            .push(
              discard
            );

          closeChoice();

          setStatus(
            'Du behältst ' +
            names[keep.type] +
            '.'
          );

          finishYourTurn();
        }
      }

    ]
  );
}

function takePile(index){

  if(
    state.busy ||
    state.roundOver ||
    state.turn !== 'you'
  ){
    return;
  }

  const card =
    state.piles[index]
      .pop();

  if(!card){
    return;
  }

  state.hand.push(
    card
  );

  setStatus(
    'Du nimmst ' +
    names[card.type] +
    ' aus Ablage ' +
    (
      index===0
        ? 'A'
        : 'B'
    ) +
    '.'
  );

  render();

  finishYourTurn();
}

function removeCards(
  typeA,
  typeB
){

  const firstIndex =
    state.hand.findIndex(
      card=>
        card.type===typeA
    );

  if(firstIndex<0){
    return null;
  }

  const first =
    state.hand.splice(
      firstIndex,
      1
    )[0];

  const secondIndex =
    state.hand.findIndex(
      card=>
        card.type===typeB
    );

  if(secondIndex<0){

    state.hand.push(
      first
    );

    return null;
  }

  const second =
    state.hand.splice(
      secondIndex,
      1
    )[0];

  return [
    first,
    second
  ];
}

function playDuo(
  typeA,
  typeB
){

  if(
    state.busy ||
    state.roundOver ||
    state.turn !== 'you'
  ){
    return;
  }

  const pair =
    removeCards(
      typeA,
      typeB
    );

  if(!pair){
    return;
  }

  state.played.push(
    ...pair
  );

  render();

  if(typeA==='boat'){

    state.extraTurn =
      true;

    setStatus(
      'Boot-Duo ausgespielt. Du bekommst sofort einen Extra-Zug.'
    );

    finishYourTurn();

    return;
  }

  if(typeA==='fish'){

    if(state.deck.length){

      const card =
        state.deck.pop();

      state.hand.push(
        card
      );

      setStatus(
        'Fisch-Duo ausgespielt. Du ziehst ' +
        names[card.type] +
        ' vom Nachziehstapel.'
      );
    }

    render();

    finishYourTurn();

    return;
  }

  if(
    typeA==='shark' &&
    typeB==='swimmer'
  ){

    if(
      state.silasHand.length
    ){

      const randomIndex =
        Math.floor(
          Math.random() *
          state.silasHand.length
        );

      const stolen =
        state.silasHand.splice(
          randomIndex,
          1
        )[0];

      state.hand.push(
        stolen
      );

      setStatus(
        'Hai + Schwimmer ausgespielt. Du stiehlst ' +
        names[stolen.type] +
        ' von Silas.'
      );

    }
    else{

      setStatus(
        'Hai + Schwimmer ausgespielt. Silas hat keine Karte zum Stehlen.'
      );
    }

    render();

    finishYourTurn();

    return;
  }

  if(typeA==='crab'){

    chooseCrabPile();
  }
}

function chooseCrabPile(){

  showChoice(
    'Welchen Ablagestapel möchtest du mit Mr Krabs durchsuchen?',
    [

      {
        label:
          'Stapel A durchsuchen',

        onClick:
          ()=>showCrabCards(0)
      },

      {
        label:
          'Stapel B durchsuchen',

        onClick:
          ()=>showCrabCards(1)
      }

    ]
  );
}

function showCrabCards(index){

  $('choiceTitle')
    .textContent =
    'Wähle eine Karte aus Ablage ' +
    (
      index===0
        ? 'A'
        : 'B'
    );

  $('choiceGrid')
    .innerHTML =
    '';

  if(
    state.piles[index]
      .length===0
  ){

    const button =
      document.createElement(
        'button'
      );

    button.type =
      'button';

    button.className =
      'btn';

    button.textContent =
      'Stapel ist leer';

    button.addEventListener(
      'click',
      ()=>{

        closeChoice();

        finishYourTurn();
      }
    );

    $('choiceGrid')
      .appendChild(button);

    return;
  }

  state.piles[index]
    .slice()
    .reverse()
    .forEach(card=>{

      const button =
        document.createElement(
          'button'
        );

      button.type =
        'button';

      button.className =
        'btn';

      button.innerHTML =
        cardHTML(card);

      button.addEventListener(
        'click',
        ()=>{

          const realIndex =
            state.piles[index]
              .findIndex(
                item=>
                  item.id===
                  card.id
              );

          const chosen =
            state.piles[index]
              .splice(
                realIndex,
                1
              )[0];

          state.hand.push(
            chosen
          );

          closeChoice();

          setStatus(
            'Mr Krabs holt ' +
            names[chosen.type] +
            ' aus Ablage ' +
            (
              index===0
                ? 'A'
                : 'B'
            ) +
            '.'
          );

          finishYourTurn();
        }
      );

      $('choiceGrid')
        .appendChild(button);
    });
}

function finishYourTurn(){

  if(state.extraTurn){

    state.extraTurn =
      false;

    state.turn =
      'you';

    state.busy =
      false;

    $('silasMove')
      .textContent =
      'wartet';

    setStatus(
      'Du hast einen Extra-Zug.'
    );

    render();

    return;
  }

  state.turn =
    'silas';

  state.busy =
    true;

  $('silasMove')
    .textContent =
    'ist dran …';

  setStatus(
    'Silas ist dran …'
  );

  render();

  setTimeout(
    silasTurn,
    700
  );
}

function silasCardValue(card){

  let value = 0;

  if(
    card.type==='mermaid'
  ){
    value += 7;
  }

  if(
    card.type==='penguin' ||
    card.type==='octopus' ||
    card.type==='shell' ||
    card.type==='sailor'
  ){
    value += 4;
  }

  if(
    card.type==='lighthouse' ||
    card.type==='shoal' ||
    card.type==='colony' ||
    card.type==='captain'
  ){
    value += 3;
  }

  if(
    card.type==='crab' ||
    card.type==='boat' ||
    card.type==='fish'
  ){

    value +=
      countType(
        state.silasHand,
        card.type
      ) > 0
        ? 5
        : 1;
  }

  if(
    card.type==='shark' &&
    countType(
      state.silasHand,
      'swimmer'
    ) > 0
  ){
    value += 5;
  }

  if(
    card.type==='swimmer' &&
    countType(
      state.silasHand,
      'shark'
    ) > 0
  ){
    value += 5;
  }

  return value;
}

function silasTurn(){

  if(
    !state.started ||
    state.roundOver
  ){
    return;
  }

  const a =
    topCard(0);

  const b =
    topCard(1);

  const valueA =
    a
      ? silasCardValue(a)
      : -1;

  const valueB =
    b
      ? silasCardValue(b)
      : -1;

  const bestOpen =
    Math.max(
      valueA,
      valueB
    );

  if(bestOpen>=4){

    const index =
      valueA>=valueB
        ? 0
        : 1;

    const card =
      state.piles[index]
        .pop();

    state.silasHand.push(
      card
    );

    $('silasMove')
      .textContent =
      'nahm eine offene Karte';

  }
  else if(
    state.deck.length>=2
  ){

    const first =
      state.deck.pop();

    const second =
      state.deck.pop();

    const firstValue =
      silasCardValue(
        first
      );

    const secondValue =
      silasCardValue(
        second
      );

    let keep;
    let discard;

    if(
      firstValue>=
      secondValue
    ){

      keep =
        first;

      discard =
        second;

    }
    else{

      keep =
        second;

      discard =
        first;
    }

    state.silasHand.push(
      keep
    );

    const pileIndex =
      Math.random()<0.5
        ? 0
        : 1;

    state.piles[pileIndex]
      .push(
        discard
      );

    $('silasMove')
      .textContent =
      'zog zwei Karten';

  }
  else{

    let index = -1;

    if(a && b){

      index =
        valueA>=valueB
          ? 0
          : 1;

    }
    else if(a){

      index=0;

    }
    else if(b){

      index=1;
    }

    if(index>=0){

      state.silasHand.push(
        state.piles[index]
          .pop()
      );

      $('silasMove')
        .textContent =
        'nahm eine offene Karte';
    }
  }

  state.busy =
    false;

  state.turn =
    'you';

  setStatus(
    'Silas ist fertig. Du bist dran.'
  );

  render();
}

function stopRound(){

  if(
    state.roundOver ||
    state.turn !== 'you' ||
    score() < 7
  ){
    return;
  }

  state.roundOver =
    true;

  state.busy =
    true;

  setStatus(
    'Stopp funktioniert. Runde beendet – Testversion 8a.'
  );

  render();
}

$('newBtn')
  .addEventListener(
    'click',
    newGame
  );

$('drawBtn')
  .addEventListener(
    'click',
    drawTwo
  );

$('pileA')
  .addEventListener(
    'click',
    ()=>takePile(0)
  );

$('pileB')
  .addEventListener(
    'click',
    ()=>takePile(1)
  );

$('stopBtn')
  .addEventListener(
    'click',
    stopRound
  );

render();

})();
</script>

</body>
</html>
